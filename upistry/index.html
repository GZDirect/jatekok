<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="author" content="Fejes Géza">
<meta name="copyright" content="© 2026 Fejes Géza. Minden jog fenntartva.">
<meta name="description" content="Upistry – one-tap tower stacking through 30 worlds.">
<meta name="theme-color" content="#170f33">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Upistry">
<link rel="icon" type="image/png" sizes="32x32" href="favicon-32.png">
<link rel="apple-touch-icon" sizes="180x180" href="apple-touch-icon.png">
<style>:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0;font:14px/1.5 system-ui,sans-serif}img{max-width:100%}[hidden]{display:none!important}</style>
<title>Upistry</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bungee&family=Outfit:wght@500;700&display=swap">
<style>
/* Layout: side-view world canvas fills the screen; HUD (world, floors, goal bar, 3-step perfect meter, MASTER line) floats top-centre;
   menus are top sheets so the tower stays visible; worlds, profile and settings are full scrolling sheets */
:root{
  --night:#170f33; --ink:#fffaf2; --dim:rgba(255,250,242,.72); --gold:#ffcf4a; --coral:#ff7d6b; --mint:#7ef2d0;
  --display:'Bungee',system-ui,sans-serif; --body:'Outfit',system-ui,sans-serif;
  color-scheme:dark;
}
html,body{height:100%}
body{background:var(--night);color:var(--ink);font-family:var(--body);overflow:hidden;padding-block:0;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));
  -webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent;touch-action:manipulation}
#g{position:fixed;inset:0;width:100%;height:100%;display:block;touch-action:none}
#probe{position:fixed;visibility:hidden;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
.hud{position:fixed;left:0;right:0;top:0;z-index:2;pointer-events:none;text-align:center;display:flex;flex-direction:column;align-items:center;
  padding:calc(env(safe-area-inset-top,0px) + 12px) max(64px,env(safe-area-inset-right,0px)) 0 max(64px,env(safe-area-inset-left,0px))}
.hud::before{content:"";position:absolute;left:50%;top:0;width:min(460px,120vw);height:calc(env(safe-area-inset-top,0px) + 160px);transform:translateX(-50%);background:radial-gradient(60% 70% at 50% 30%,rgba(23,15,51,.42),rgba(23,15,51,0));z-index:-1}
.wname{font:700 11px/1.2 var(--body);letter-spacing:.1em;text-transform:uppercase;color:var(--dim);text-shadow:0 1px 6px rgba(0,0,0,.4);max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.floors{font:400 clamp(44px,13vw,74px)/1 var(--display);font-variant-numeric:tabular-nums;color:#fff;margin-top:4px;text-shadow:0 3px 0 rgba(23,15,51,.35),0 0 30px rgba(255,255,255,.35)}
.floors.bump{animation:bump .22s ease-out}
@keyframes bump{40%{transform:scale(1.12)}}
.goal{display:flex;align-items:center;gap:8px;margin-top:6px;font:700 12px/1 var(--body);letter-spacing:.12em;text-transform:uppercase;color:#fff;text-shadow:0 1px 6px rgba(0,0,0,.45)}
.bar{width:min(150px,36vw);height:6px;border-radius:99px;background:rgba(255,255,255,.22);overflow:hidden}
.bar i{display:block;height:100%;width:0;background:var(--gold);border-radius:99px;transition:width .25s}
.meter{display:flex;align-items:center;gap:6px;margin-top:9px}
.pip{width:22px;height:8px;border-radius:3px;background:rgba(255,255,255,.2);transition:background .15s,box-shadow .15s}
.pip.on{background:var(--gold);box-shadow:0 0 8px rgba(255,207,74,.8)}
.meter.hot .pip{background:#fff;box-shadow:0 0 12px #fff,0 0 4px var(--gold)}
.mlbl{font:700 10px/1 var(--body);letter-spacing:.14em;text-transform:uppercase;color:var(--dim);margin-left:4px;text-shadow:0 1px 6px rgba(0,0,0,.45)}
.meter.hot .mlbl{color:#fff}
.streak{margin-top:7px;font:700 13px/1 var(--body);letter-spacing:.1em;text-transform:uppercase;color:var(--gold);min-height:13px;text-shadow:0 0 12px rgba(255,207,74,.7)}
.mline{margin-top:6px;font:700 10px/1.2 var(--body);letter-spacing:.12em;text-transform:uppercase;color:var(--dim);text-shadow:0 1px 6px rgba(0,0,0,.5)}
.mline.ok{color:var(--mint)}
.mute,.pause{position:fixed;z-index:6;top:calc(env(safe-area-inset-top,0px) + 12px);
  background:rgba(23,15,51,.3);border:1px solid rgba(255,250,242,.4);color:var(--ink);font:700 10px/1 var(--body);letter-spacing:.14em;padding:8px 10px;border-radius:99px;cursor:pointer}
.mute{right:max(12px,env(safe-area-inset-right,0px))}
.pause{left:max(12px,env(safe-area-inset-left,0px));font-size:13px;padding:7px 12px}
.tip{position:fixed;left:0;right:0;bottom:calc(env(safe-area-inset-bottom,0px) + 22px);z-index:2;text-align:center;pointer-events:none;
  font:700 13px/1.3 var(--body);letter-spacing:.14em;text-transform:uppercase;color:#fff;text-shadow:0 1px 8px rgba(0,0,0,.5);animation:breathe 2s ease-in-out infinite;padding-inline:16px}
@keyframes breathe{50%{opacity:.4}}
.banner{position:fixed;left:0;right:0;top:31%;z-index:3;text-align:center;pointer-events:none;opacity:0;padding-inline:16px}
.banner .big{display:block;font:400 clamp(26px,8.5vw,48px)/1.05 var(--display);color:#fff;text-shadow:0 4px 0 rgba(23,15,51,.35),0 0 26px rgba(255,207,74,.6)}
.banner .sub{display:block;margin-top:8px;font:700 13px/1.2 var(--body);letter-spacing:.16em;text-transform:uppercase;text-shadow:0 1px 8px rgba(0,0,0,.5)}
.banner.go{animation:pop 1.6s cubic-bezier(.2,.9,.25,1) forwards}
@keyframes pop{0%{opacity:0;transform:scale(.6)}12%{opacity:1;transform:scale(1.06)}22%{transform:scale(1)}78%{opacity:1}100%{opacity:0;transform:translateY(-18px)}}
.toast{position:fixed;left:50%;bottom:calc(env(safe-area-inset-bottom,0px) + 64px);z-index:4;transform:translateX(-50%);pointer-events:none;opacity:0;
  display:flex;align-items:center;gap:10px;max-width:min(420px,calc(100vw - 32px));background:rgba(23,15,51,.86);border:1px solid rgba(255,207,74,.55);border-radius:14px;padding:9px 14px;box-sizing:border-box}
.toast b{font:400 22px/1 var(--display);color:var(--gold)}
.toast .k{font:700 10px/1 var(--body);letter-spacing:.16em;text-transform:uppercase;color:var(--gold)}
.toast .n{font:700 14px/1.25 var(--body);margin-top:3px}
.toast.go{animation:toast 2.4s ease forwards}
@keyframes toast{0%{opacity:0;transform:translate(-50%,16px)}10%{opacity:1;transform:translate(-50%,0)}85%{opacity:1}100%{opacity:0;transform:translate(-50%,-6px)}}
.screen{position:fixed;left:0;right:0;top:0;z-index:5;display:flex;flex-direction:column;align-items:center;gap:14px;text-align:center;max-height:100%;overflow-y:auto;box-sizing:border-box;
  background:linear-gradient(180deg,rgba(23,15,51,.9) 0%,rgba(23,15,51,.7) 74%,rgba(23,15,51,0) 100%);
  padding:calc(env(safe-area-inset-top,0px) + 36px) max(20px,env(safe-area-inset-right,0px)) 56px max(20px,env(safe-area-inset-left,0px))}
.title{font:400 clamp(44px,14vw,82px)/.92 var(--display);color:#fff;text-shadow:0 5px 0 var(--coral),0 0 40px rgba(255,180,120,.5)}
.tag{font:700 12px/1.2 var(--body);letter-spacing:.2em;text-transform:uppercase;color:var(--dim)}
.tag.win{color:var(--gold)}
.wtitle{font:400 clamp(20px,6vw,30px)/1.1 var(--display);color:#fff;text-wrap:balance}
.lead{max-width:34ch;font:500 15px/1.45 var(--body);color:#fff3e6;margin:0}
.btns{display:flex;gap:10px;flex-wrap:wrap;justify-content:center;max-width:420px}
.col{flex-direction:column;align-items:center}
.btn{font:400 17px/1 var(--display);color:var(--night);background:var(--gold);border:0;border-radius:14px;padding:15px 22px;cursor:pointer;box-shadow:0 5px 0 #c98f12}
.btn:active{transform:translateY(3px);box-shadow:0 2px 0 #c98f12}
.btn.ghost{background:rgba(255,250,242,.12);color:#fff;box-shadow:inset 0 0 0 1.5px rgba(255,250,242,.5)}
.btn.mint{background:var(--mint);box-shadow:0 5px 0 #3aa889}
.btn.wide{width:min(320px,100%)}
.btn.sm{font-size:14px;padding:11px 16px}
button:focus-visible,input:focus-visible,textarea:focus-visible{outline:2px solid #fff;outline-offset:3px}
.final{font:400 clamp(60px,19vw,104px)/1 var(--display);color:#fff;text-shadow:0 5px 0 var(--coral);font-variant-numeric:tabular-nums}
.badge{font:400 14px/1 var(--display);color:var(--night);background:var(--gold);padding:7px 12px;border-radius:99px;box-shadow:0 0 18px rgba(255,207,74,.6)}
.stats{display:grid;grid-template-columns:repeat(3,auto);gap:10px 24px;justify-content:center}
.stat .v{font:400 22px/1.2 var(--display);margin-top:4px;font-variant-numeric:tabular-nums}
.lbl{font:700 11px/1.2 var(--body);letter-spacing:.16em;text-transform:uppercase;color:var(--dim)}
.rec{font:700 12px/1.35 var(--body);letter-spacing:.14em;text-transform:uppercase;color:var(--gold)}
.rec.mintc{color:var(--mint)}
.copy{font:500 11px/1 var(--body);color:rgba(255,250,242,.55)}
.stars{display:inline-flex;gap:2px;color:rgba(255,255,255,.28);letter-spacing:0}
.stars b{font-weight:400}
.stars b.on{color:var(--gold);text-shadow:0 0 10px rgba(255,207,74,.6)}
.bigstars{font:400 46px/1 var(--display);gap:10px}
.bigstars b{display:inline-block;transform:scale(0);transition:transform .35s cubic-bezier(.3,1.6,.5,1)}
.bigstars b.in{transform:scale(1)}
.chips{display:flex;flex-wrap:wrap;gap:6px;justify-content:center;max-width:420px}
.chip{font:700 11px/1 var(--body);letter-spacing:.1em;text-transform:uppercase;padding:6px 9px;border-radius:99px;background:rgba(255,207,74,.16);color:var(--gold)}
.sheet{position:fixed;inset:0;z-index:7;overflow-y:auto;background:linear-gradient(180deg,#1d1440,#120c29);
  padding:calc(env(safe-area-inset-top,0px) + 18px) max(16px,env(safe-area-inset-right,0px)) calc(env(safe-area-inset-bottom,0px) + 28px) max(16px,env(safe-area-inset-left,0px))}
.sheethead{display:flex;align-items:center;justify-content:space-between;gap:12px;max-width:980px;margin:0 auto 14px}
.sheethead h2{margin:0;font:400 26px/1 var(--display)}
.sheethead .sub{font:700 12px/1.2 var(--body);letter-spacing:.12em;text-transform:uppercase;color:var(--gold);margin-top:6px}
.close{background:rgba(255,255,255,.1);border:1px solid rgba(255,255,255,.3);color:#fff;font:700 12px/1 var(--body);letter-spacing:.12em;padding:10px 14px;border-radius:99px;cursor:pointer;text-transform:uppercase}
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(148px,1fr));gap:12px;max-width:980px;margin:0 auto}
.card{position:relative;display:flex;flex-direction:column;gap:6px;text-align:left;background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.12);border-radius:14px;padding:8px 8px 10px;color:#fff;cursor:pointer;font:inherit;min-width:0}
.card canvas{width:100%;aspect-ratio:16/11;border-radius:9px;display:block;max-width:100%}
.card .num{font:700 10px/1 var(--body);letter-spacing:.16em;color:var(--dim)}
.card .nm{font:400 14px/1.15 var(--display);overflow-wrap:anywhere}
.card .meta{display:flex;justify-content:space-between;align-items:center;gap:6px;font:500 12px/1.2 var(--body);color:var(--dim)}
.card .st{font:700 10px/1 var(--body);letter-spacing:.12em;text-transform:uppercase;padding:4px 6px;border-radius:6px;align-self:flex-start}
.card .mst{position:absolute;top:14px;right:14px;font:400 10px/1 var(--display);background:var(--gold);color:var(--night);padding:4px 6px;border-radius:6px}
.st.done{background:rgba(126,242,208,.18);color:var(--mint)}
.st.open{background:rgba(255,207,74,.18);color:var(--gold)}
.st.lock{background:rgba(255,255,255,.08);color:rgba(255,255,255,.5)}
.card.locked{cursor:default;opacity:.85}
.card.sel{border-color:var(--gold);box-shadow:0 0 0 1px var(--gold)}
.task{font:400 clamp(20px,6vw,28px)/1.2 var(--display);max-width:22ch;text-wrap:balance}
.ok{color:var(--mint)}
.panel{max-width:620px;margin:0 auto;display:flex;flex-direction:column;gap:18px}
.box{background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.12);border-radius:16px;padding:16px;display:flex;flex-direction:column;gap:12px}
.box h3{margin:0;font:700 12px/1.2 var(--body);letter-spacing:.16em;text-transform:uppercase;color:var(--dim)}
.rank{display:flex;align-items:center;gap:14px}
.rank .ico{width:58px;height:58px;border-radius:16px;background:linear-gradient(160deg,var(--gold),var(--coral));display:grid;place-items:center;font:400 26px/1 var(--display);color:var(--night);flex:none}
.rank .nm{font:400 22px/1.1 var(--display)}
.xp{height:8px;border-radius:99px;background:rgba(255,255,255,.15);overflow:hidden}
.xp i{display:block;height:100%;background:var(--gold)}
.sgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(130px,1fr));gap:12px}
.sgrid .v{font:400 22px/1.2 var(--display);font-variant-numeric:tabular-nums;margin-top:4px}
.achs{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:8px}
.ach{display:flex;gap:10px;align-items:center;padding:10px;border-radius:12px;background:rgba(255,255,255,.05);min-width:0}
.ach .i{width:34px;height:34px;border-radius:10px;flex:none;display:grid;place-items:center;font:400 16px/1 var(--display);background:rgba(255,255,255,.08);color:rgba(255,255,255,.35)}
.ach.on .i{background:var(--gold);color:var(--night)}
.ach .t{font:700 14px/1.2 var(--body)}
.ach .d{font:500 12px/1.3 var(--body);color:var(--dim)}
.ach:not(.on) .t{color:rgba(255,255,255,.6)}
.row{display:flex;align-items:center;justify-content:space-between;gap:14px;flex-wrap:wrap}
.row label{font:700 15px/1.3 var(--body)}
.row small{display:block;font:500 12px/1.3 var(--body);color:var(--dim)}
.seg{display:inline-flex;border:1px solid rgba(255,255,255,.3);border-radius:99px;overflow:hidden}
.seg button{background:none;border:0;color:#fff;font:700 13px/1 var(--body);padding:9px 14px;cursor:pointer}
.seg button[aria-pressed="true"]{background:var(--gold);color:var(--night)}
input[type=range]{width:min(220px,100%);accent-color:var(--gold)}
textarea{width:100%;box-sizing:border-box;min-height:70px;background:rgba(0,0,0,.25);border:1px solid rgba(255,255,255,.25);border-radius:10px;color:#fff;font:500 12px/1.4 ui-monospace,monospace;padding:10px;resize:vertical;-webkit-user-select:text;user-select:text}
.note{font:500 13px/1.45 var(--body);color:var(--dim);margin:0}
.cardview{position:fixed;inset:0;z-index:9;background:rgba(10,6,24,.94);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;padding:20px 16px;box-sizing:border-box}
.cardview img{max-height:68vh;max-width:100%;border-radius:16px;box-shadow:0 10px 40px rgba(0,0,0,.5);-webkit-user-select:auto;user-select:auto;-webkit-touch-callout:default}
@media (max-height:520px){.floors{font-size:34px}.hud::before{height:110px}.goal{margin-top:3px}.meter{margin-top:5px}.streak,.mline{display:none}.screen{padding-top:16px;gap:10px}.title{font-size:40px}.final{font-size:54px}.bigstars{font-size:32px}}
@media (prefers-reduced-motion:reduce){.tip{animation:none}}
.rm .tip{animation:none}.rm .banner.go{animation-duration:2s}.rm .floors.bump{animation:none}
</style>
</head>
<body>
<canvas id="g" aria-label="Upistry"></canvas>
<div id="probe"></div>
<button class="mute" id="mute" type="button"></button>
<button class="pause" id="pauseBtn" type="button" hidden aria-label="II">II</button>
<div class="hud" id="hud" hidden>
  <div class="wname" id="hWorld"></div>
  <div class="floors" id="floors">0</div>
  <div class="goal"><span id="hGoal"></span><span class="bar"><i id="hBar"></i></span></div>
  <div class="meter" id="meter"><span class="pip"></span><span class="pip"></span><span class="pip"></span><span class="mlbl" id="mLbl"></span></div>
  <div class="streak" id="streak"></div>
  <div class="mline" id="hMaster"></div>
</div>
<div class="tip" id="tip" hidden data-i="tip"></div>
<div class="banner" id="banner"><span class="big" id="bBig"></span><span class="sub" id="bSub"></span></div>
<div class="toast" id="toast"><b>★</b><div><div class="k" id="toastK"></div><div class="n" id="toastN"></div></div></div>

<div class="screen" id="menu">
  <div class="title">UPISTRY</div>
  <div>
    <div class="tag" id="mNum"></div>
    <div class="wtitle" id="mName" style="margin-top:6px"></div>
    <div class="rec" id="mInfo" style="margin-top:8px"></div>
  </div>
  <div class="btns">
    <button class="btn" id="bStart" type="button" data-i="play"></button>
    <button class="btn ghost" id="bWorlds" type="button" data-i="worlds"></button>
    <button class="btn ghost" id="bDaily" type="button" data-i="daily"></button>
  </div>
  <div class="btns">
    <button class="btn ghost sm" id="bProfile" type="button" data-i="profile"></button>
    <button class="btn ghost sm" id="bSettings" type="button" data-i="settings"></button>
  </div>
  <div class="rec" id="menuRec"></div>
  <div class="copy">© 2026 Fejes Géza</div>
</div>

<div class="screen" id="pauseScr" hidden>
  <div class="tag" data-i="paused"></div>
  <div class="wtitle" id="pName"></div>
  <div class="btns col">
    <button class="btn wide" id="bResume" type="button" data-i="resume"></button>
    <button class="btn ghost wide" id="bQuit" type="button" data-i="quit"></button>
  </div>
</div>

<div class="screen" id="result" hidden>
  <div class="tag" id="rTag"></div>
  <div class="wtitle" id="rName"></div>
  <div class="final" id="rFloors">0</div>
  <div class="badge" id="rNew" hidden data-i="newRecBadge"></div>
  <div class="stars bigstars" id="rStars" hidden><b>★</b><b>★</b><b>★</b></div>
  <div class="stats">
    <div class="stat"><div class="lbl" data-i="prevBest"></div><div class="v" id="rPrev">0</div></div>
    <div class="stat"><div class="lbl" data-i="perfects"></div><div class="v" id="rPerf">0</div></div>
    <div class="stat"><div class="lbl" data-i="longest"></div><div class="v" id="rStreak">0</div></div>
  </div>
  <div class="rec" id="rInfo"></div>
  <div class="rec mintc" id="rMaster"></div>
  <div class="chips" id="rAch"></div>
  <div class="btns col">
    <button class="btn wide" id="bNext" type="button" hidden data-i="nextWorld"></button>
    <button class="btn wide" id="bAgain" type="button" data-i="again"></button>
    <button class="btn mint wide" id="bCp" type="button" hidden></button>
    <div class="btns"><button class="btn ghost sm" id="bResWorlds" type="button" data-i="worlds"></button><button class="btn ghost sm" id="bShare" type="button" data-i="shareCard"></button><button class="btn ghost sm" id="bMenu" type="button" data-i="menu"></button></div>
  </div>
</div>

<div class="screen" id="dailyScr" hidden>
  <div class="tag" id="dDate"></div>
  <div class="task" id="dTask"></div>
  <div class="rec" id="dWorld"></div>
  <div class="rec" id="dStatus"></div>
  <div class="btns col">
    <button class="btn wide" id="bDailyGo" type="button" data-i="start"></button>
    <button class="btn ghost wide" id="bDailyBack" type="button" data-i="back"></button>
  </div>
  <p class="lead" style="font-size:14px;opacity:.85" data-i="dailyNote"></p>
</div>

<div class="sheet" id="worlds" hidden>
  <div class="sheethead">
    <div><h2 data-i="worlds"></h2><div class="sub" id="wSum"></div></div>
    <button class="close" id="bWClose" type="button" data-i="back"></button>
  </div>
  <div class="cards" id="cards"></div>
</div>

<div class="sheet" id="profile" hidden>
  <div class="sheethead" style="max-width:620px">
    <h2 data-i="profile"></h2>
    <button class="close" id="bPClose" type="button" data-i="back"></button>
  </div>
  <div class="panel">
    <div class="box">
      <div class="rank"><div class="ico" id="pRankN">1</div><div style="flex:1;min-width:0"><div class="lbl" data-i="rank"></div><div class="nm" id="pRank"></div></div></div>
      <div class="xp"><i id="pXp"></i></div>
      <div class="note" id="pXpTxt"></div>
    </div>
    <div class="box"><h3 data-i="stats"></h3><div class="sgrid" id="pStats"></div></div>
    <div class="box"><h3 id="pAchH"></h3><div class="achs" id="pAch"></div></div>
  </div>
</div>

<div class="sheet" id="settings" hidden>

const num01=(v,d)=>{v=Number(v);return Number.isFinite(v)?clamp(v,0,1):d};
function sanitize(s){
  const d=defaultSave();
  if(s&&typeof s==='object'){
    d.unlocked=int(s.unlocked,1,NW,1);d.overall=int(s.overall,0,99999);d.migrated=s.migrated===true;
    if(Array.isArray(s.worlds))s.worlds.slice(0,NW).forEach((w,i)=>{if(w&&typeof w==='object')d.worlds[i]={best:int(w.best,0,99999),stars:int(w.stars,0,3),done:w.done===true,master:w.master===true,zone:int(w.zone,0,5)}});
    if(s.daily&&typeof s.daily==='object')for(const k of Object.keys(s.daily).sort().slice(-30)){const v=s.daily[k];if(/^\d{4}-\d\d-\d\d$/.test(k)&&v&&typeof v==='object')d.daily[k]={done:v.done===true,best:int(v.best,0,99999),perf:int(v.perf,0,99999)}}
    d.sel=int(s.sel,0,NW-1,0);
    const st=s.settings&&typeof s.settings==='object'?s.settings:{};
    d.settings.lang=st.lang==='hu'||st.lang==='en'?st.lang:null;
    d.settings.sfx=num01(st.sfx,.8);d.settings.music=num01(st.music,.35);
    d.settings.muted=typeof st.muted==='boolean'?st.muted:s.muted===true;   // v2 kept "muted" at the top level
    d.settings.haptics=st.haptics!==false;d.settings.reduce=typeof st.reduce==='boolean'?st.reduce:null;
    const p=s.profile&&typeof s.profile==='object'?s.profile:{};
    d.profile={floors:int(p.floors,0,1e9),perfects:int(p.perfects,0,1e9),runs:int(p.runs,0,1e9),bestStreak:int(p.bestStreak,0,99999)};
    if(s.ach&&typeof s.ach==='object')for(const a of ACH)if(Number.isFinite(Number(s.ach[a.id])))d.ach[a.id]=Number(s.ach[a.id]);
  }
  d.worlds.forEach((w,i)=>{if(w.done)d.unlocked=Math.max(d.unlocked,Math.min(NW,i+2));if(w.done&&w.stars<1)w.stars=1;d.overall=Math.max(d.overall,w.best)});

const LAYER_H=[.62,.5,.36],LAYER_F=[.12,.25,.45];
let layers=[];
function buildLayers(){
  layers=[];if(WD.classic)return;
  WD.layers.forEach((L,k)=>{if(L[0]==='none'){layers.push(null);return}const h=H*LAYER_H[k];const[c,g]=off(W,h);g.fillStyle=L[1];SIL[L[0]](g,W,h,mulberry(wi*31+k*7+3),L[1],L[2]);layers.push({c,h})});
}
// ambient life
let amb=[],lowFx=false;
function buildAmb(){
  amb=[];const a=WD.amb;if(!a)return;const r=mulberry(wi*77+5);const n=Math.round(a[3]*(lowFx?.5:1));
  for(let k=0;k<n;k++)amb.push({x:r()*W,y:a[0]==='fly'?H*(.08+r()*.4):a[0]==='drift'&&a[1]==='cloudlet'?H*(.06+r()*.35):r()*H,s:.6+r()*.8,ph:r()*6.28,rot:r()*6.28,c:Array.isArray(a[2])?a[2][(r()*a[2].length)|0]:a[2],dir:r()<.5?-1:1});
}
function updAmb(dt){
  const a=WD.amb;if(!a)return;
  for(const p of amb){
    if(a[0]==='fly'){p.x+=p.dir*(28+30*p.s)*dt;p.y+=Math.sin(clock*1.2+p.ph)*6*dt;if(p.x>W+30)p.x=-30;if(p.x<-30)p.x=W+30}
    else if(a[0]==='fall'){p.y+=(22+38*p.s)*dt;p.x+=Math.sin(clock*1.3+p.ph)*14*dt;p.rot+=dt*(1+p.s);if(p.y>H+12){p.y=-12;p.x=Math.random()*W}}
    else if(a[0]==='rise'){p.y-=(18+34*p.s)*dt;p.x+=Math.sin(clock+p.ph)*10*dt;if(p.y<-14){p.y=H+14;p.x=Math.random()*W}}
    else if(a[0]==='drift'){p.x+=(6+12*p.s)*dt;p.rot+=dt;if(p.x>W+40)p.x=-40}
  }
}

   case'snow':g.beginPath();circ(g,x,y,r*.9);g.fill();break;

const AMB_R={bird:5,cloudlet:9,lantern:4,puff:5,holo:8,tumble:6,petal:3,leaf:3.4,snow:2.2,spark:1.6,star:2,bubble:2.4,dot:1.8,square:2};
function drawAmb(g){

// sky extras

    if(e==='nebula'){for(const[x,y,c]of[[.25,.25,'rgba(255,90,200,.16)'],[.7,.4,'rgba(90,160,255,.16)'],[.5,.15,'rgba(160,90,255,.14)']]){const gr=g.createRadialGradient(W*x,H*y+shift,0,W*x,H*y+shift,W*.5);gr.addColorStop(0,c);gr.addColorStop(1,'rgba(0,0,0,0)');g.fillStyle=gr;g.fillRect(0,0,W,H)}}

// ---------- ground & pedestal ----------
function drawGround(g,gy){
  if(gy>=H)return;const[c,kind]=WD.ground;if(kind==='none')return;
  const gr=g.createLinearGradient(0,gy,0,H);gr.addColorStop(0,c);gr.addColorStop(1,darker(c,.55));g.fillStyle=gr;g.fillRect(0,gy,W,H-gy);
  g.lineWidth=1.5;
  if(kind==='water'){g.strokeStyle='rgba(255,255,255,.25)';for(let k=0;k<6;k++){const yy=gy+8+k*14*zoom;g.beginPath();for(let x=0;x<=W;x+=12){const y=yy+Math.sin(x*.04+clock*1.5+k)*2;x?g.lineTo(x,y):g.moveTo(x,y)}g.stroke()}}
  else if(kind==='lava'){const p=.6+.4*Math.sin(clock*2);g.fillStyle=`rgba(255,220,90,${.35*p})`;for(let k=0;k<8;k++){const x=((k*137+clock*12)%(W+40))-20;g.beginPath();g.ellipse(x,gy+10+(k%3)*12,22,4,0,0,7);g.fill()}g.fillStyle='rgba(40,10,5,.5)';g.fillRect(0,gy,W,3)}
  else if(kind==='grass'){g.fillStyle='rgba(0,0,0,.12)';for(let x=0;x<W;x+=9)g.fillRect(x,gy,2,4+((x*7)%6))}
  else if(kind==='sand'){g.strokeStyle='rgba(255,255,255,.18)';for(let k=0;k<4;k++){g.beginPath();for(let x=0;x<=W;x+=10)g.lineTo(x,gy+10+k*14+Math.sin(x*.03+k)*3);g.stroke()}}
  else if(kind==='floor'||kind==='stone'){g.strokeStyle='rgba(255,255,255,.08)';for(let y=gy+12;y<H;y+=16){g.beginPath();g.moveTo(0,y);g.lineTo(W,y);g.stroke()}if(kind==='stone')for(let x=((gy|0)%40);x<W;x+=40){g.beginPath();g.moveTo(x,gy);g.lineTo(x,H);g.stroke()}}
  else if(kind==='snow'){g.fillStyle='rgba(160,200,230,.25)';for(let k=0;k<5;k++){g.beginPath();g.ellipse((k*173)%W,gy+16+(k%2)*14,60,6,0,0,7);g.fill()}}
  else if(kind==='moon'){g.fillStyle='rgba(0,0,0,.18)';for(let k=0;k<6;k++){g.beginPath();g.ellipse((k*151+40)%W,gy+12+(k%3)*16,18+k*3,4,0,0,7);g.fill()}}

}
function drawPed(g,top,gy){

// optional image art: 3-slice (left cap / middle / right cap)
function loadArt(wd){if(!wd.art||wd.art.img)return;const im=new Image();im.src=wd.art.block;wd.art.img=im}
function drawArt(g,im,x,y,w,h,cap){const iw=im.naturalWidth,ih=im.naturalHeight;const dc=Math.min(cap*h/ih,w/2);g.drawImage(im,0,0,cap,ih,x,y,dc,h);g.drawImage(im,cap,0,iw-cap*2,ih,x+dc,y,w-dc*2,h);g.drawImage(im,iw-cap,0,cap,ih,x+w-dc,y,dc,h)}
// one block: style + squash on landing + gold shimmer + perfect flash
function paintBlock(g,wd,x,y,w,h,b){
  if(w<=0)return;
  const st=wd.block;const art=wd.art&&wd.art.img;
  g.save();g.beginPath();g.rect(x,y,w,h);g.clip();
  if(art&&art.complete&&art.naturalWidth)drawArt(g,art,x,y,w,h,wd.art.cap||16);else STYLES[st.st](g,x,y,w,h,b,st);
  if(b.gold){if(st.st!=='crystal'){g.strokeStyle='#ffd34d';g.lineWidth=2;g.strokeRect(x+1,y+1,w-2,h-2)}g.fillStyle=`rgba(255,255,255,${.25+.25*Math.sin(clock*5+b.i)})`;const sw=w*.12,px=x+((clock*.6+b.i*.13)%1)*(w+sw)-sw;g.fillRect(px,y,sw,h)}
  if(b.flash>0){g.fillStyle=`rgba(255,255,255,${b.flash*.7})`;g.fillRect(x,y,w,h)}
  g.restore();
  if(st.st!=='crystal'){g.fillStyle='rgba(0,0,0,.28)';g.fillRect(x,y,1,h);g.fillRect(x+w-1,y,1,h)}
}
function paintBase(g,wd,x,y,w,h){
  if(wd.classic){g.fillStyle='#5b4a7a';g.fillRect(x,y,w,h);g.fillStyle='#7d6aa0';g.fillRect(x,y,w,Math.max(2,h*.22));return}
  const c=wd.ped[0]==='ring'?'#3a3a5a':wd.ped[0]==='cloud'?'#f4f0ff':wd.ped[1];g.fillStyle=darker(c,.85);g.fillRect(x,y,w,h);g.fillStyle=rgba(c,1);g.fillRect(x,y,w,Math.max(2,h*.25));g.fillStyle='rgba(0,0,0,.15)';g.fillRect(x,y+h-2,w,2);
}

// 5. CLASSIC (world 1) background — unchanged from the original game
// =====================================================================
const SKY=[[0,'#3b2a6b','#ffb38a'],[20,'#4f8fe0','#c4e8ff'],[48,'#2f63c4','#ffd59a'],[74,'#3a2c7a','#ff7d8c'],[100,'#0d1440','#4a3a8a'],[135,'#02030c','#0a0f2c']];
function skyAt(f){for(let k=0;k<SKY.length-1;k++){const[a,t0,b0]=SKY[k],[b,t1,b1]=SKY[k+1];if(f<=b){const t=Math.max(0,(f-a)/(b-a));return[mix(t0,t1,t),mix(b0,b1,t)]}}const l=SKY[SKY.length-1];return[l[1],l[2]]}
let stars=[],clouds=[];
function makeSky(){
  const r=mulberry(4242);
  stars=[];for(let k=0;k<110;k++)stars.push([r()*W,r()*H,r()*1.4+.3,r()*6.28]);
  clouds=[];for(let k=0;k<34;k++)clouds.push({x:(r()-.5)*W*1.6,y:(14+r()*64)*BH,s:.6+r()*1.2,v:(r()-.5)*14});
}
function drawStars(g,a){if(a<=0)return;for(const s of stars){g.globalAlpha=a*(.4+.6*Math.abs(Math.sin(clock*.9+s[3])));g.fillStyle='#fff';g.fillRect(s[0]-s[2]*.7,s[1]-s[2]*.7,s[2]*1.4,s[2]*1.4)}g.globalAlpha=1}
function drawClassicBg(g,fCam){
  const[top,bot]=skyAt(fCam);const sg=g.createLinearGradient(0,0,0,H);sg.addColorStop(0,top);sg.addColorStop(1,bot);g.fillStyle=sg;g.fillRect(0,0,W,H);
  drawStars(g,Math.max(0,Math.min(1,(fCam-72)/40)));
  if(fCam>105){const a=Math.min(1,(fCam-105)/30);const px=W*.8,py=H*.32-Math.min(60,(fCam-105))*1.2,pr=Math.min(W,H)*.16;g.globalAlpha=a;
    const pg=g.createRadialGradient(px-pr*.4,py-pr*.4,pr*.1,px,py,pr);pg.addColorStop(0,'#ffb38a');pg.addColorStop(.6,'#c2557a');pg.addColorStop(1,'#3a1d4f');g.fillStyle=pg;g.beginPath();g.arc(px,py,pr,0,7);g.fill();
    g.strokeStyle='rgba(255,220,190,.5)';g.lineWidth=3;g.beginPath();g.ellipse(px,py,pr*1.6,pr*.35,-.3,0,7);g.stroke();g.globalAlpha=1}
  if(fCam<60){const a=1-fCam/60;g.globalAlpha=a;const y0=sy(-BH*1.2);const gr=g.createRadialGradient(W*.25,y0,0,W*.25,y0,H*.35);gr.addColorStop(0,'rgba(255,240,200,.95)');gr.addColorStop(.12,'rgba(255,210,150,.6)');gr.addColorStop(1,'rgba(255,170,120,0)');g.fillStyle=gr;g.fillRect(0,0,W,H);g.globalAlpha=1}
}
function drawClassicFront(g){
  for(const c of clouds){const y=sy(c.y),x=W/2+c.x*zoom;if(y<-80||y>H+80)continue;const r=26*c.s*zoom;g.fillStyle='rgba(255,255,255,.75)';g.beginPath();g.arc(x,y,r,0,7);g.arc(x+r*1.1,y+r*.25,r*.8,0,7);g.arc(x-r*1.1,y+r*.3,r*.7,0,7);g.arc(x+r*.4,y-r*.5,r*.7,0,7);g.fill()}
  const seaY=sy(-BH*1.2);
  if(seaY<H){const wg=g.createLinearGradient(0,seaY,0,H);wg.addColorStop(0,'#2f5fa8');wg.addColorStop(1,'#14244f');g.fillStyle=wg;g.fillRect(0,seaY,W,H-seaY);
    g.strokeStyle='rgba(255,255,255,.25)';g.lineWidth=1.5;for(let k=0;k<6;k++){const yy=seaY+8+k*14*zoom;g.beginPath();for(let x=0;x<=W;x+=12){const y=yy+Math.sin(x*.04+clock*1.5+k)*2;x?g.lineTo(x,y):g.moveTo(x,y)}g.stroke()}
    const ib=MAXW*1.5*zoom,it=MAXW*1.08*zoom;g.fillStyle='#3b2f5a';g.beginPath();g.moveTo(W/2-it/2,sy(0));g.lineTo(W/2+it/2,sy(0));g.lineTo(W/2+ib/2,seaY+6);g.lineTo(W/2-ib/2,seaY+6);g.closePath();g.fill()}
}

// Own sound files: fill in e.g. {perfect:'hangok/perfect.mp3', place:'hangok/place.mp3'}.

const SOUND_FILES={};
const A={ctx:null,master:null,sfx:null,music:null,noise:null,buf:{},voices:[]};

    const comp=C.createDynamicsCompressor();comp.threshold.value=-16;comp.knee.value=8;comp.ratio.value=10;comp.attack.value=.003;comp.release.value=.2;

    A.sfx=C.createGain();A.sfx.connect(A.master);A.music=C.createGain();A.music.connect(A.master);applyVolumes();
    A.noise=C.createBuffer(1,C.sampleRate*.6,C.sampleRate);const d=A.noise.getChannelData(0);for(let i=0;i<d.length;i++)d[i]=Math.random()*2-1;
    for(const[k,u]of Object.entries(SOUND_FILES))fetch(u).then(r=>r.arrayBuffer()).then(b=>C.decodeAudioData(b)).then(b=>{A.buf[k]=b}).catch(()=>{});
  }catch(e){A.ctx=null}
}
function applyVolumes(){if(!A.ctx)return;const m=SET.muted,t0=A.ctx.currentTime;A.sfx.gain.setTargetAtTime(m?0:SET.sfx*SET.sfx,t0,.02);A.music.gain.setTargetAtTime(m?0:SET.music*SET.music*.55,t0,.05)}
// voice budget: overlapping sounds are attenuated and capped, the compressor catches the rest → no clipping

const PENT=[0,2,4,7,9];
const noteF=n=>392*WD.tune*Math.pow(2,Math.min(PENT[((n%5)+5)%5]+12*Math.floor(n/5),36)/12);

// material of each world's building blocks → landing sound
const MAT={stone:{f:95,band:700,q:.8,ping:0},wood:{f:150,band:1300,q:2,ping:540,pd:.09},metal:{f:120,band:2600,q:3,ping:960,pd:.35},glass:{f:170,band:3600,q:2,ping:1800,pd:.25},
  ice:{f:160,band:4200,q:4,ping:2400,pd:.3},soft:{f:80,band:420,q:.7,ping:0},paper:{f:110,band:2200,q:.6,ping:0}};
const STYLE_MAT={crystal:'glass',ribs:'metal',carved:'stone',windows:'glass',stones:'stone',beams:'wood',cake:'soft',glyphs:'stone',rocket:'metal',planks:'wood',ice:'ice',hull:'wood',books:'paper',lava:'stone',
  metal:'metal',arches:'stone',spots:'soft',facets:'glass',brass:'metal',gold:'stone',saloon:'wood',coral:'stone',neon:'glass',ginger:'soft',clock:'stone',moon:'metal',temple:'wood',prism:'glass',station:'metal',cosmic:'glass'};
const SYNTH={
  place({ratio=1}){const m=MAT[STYLE_MAT[WD.block.st]]||MAT.stone,t0=A.ctx.currentTime,f=m.f*(1+ratio*.5);osc('sine',f*1.6,t0,.22,.42,f);nz(t0,.12,.22,'bandpass',m.band,m.q);if(m.ping)osc('triangle',m.ping*(.9+ratio*.2),t0,m.pd,.07)},
  perfect({n=0,gold}){SYNTH.place({ratio:1});bell(n,0,.2);if(gold)bell(n+5,.08,.15)},
  triple({n=3}){bell(n,0,.15);bell(n+2,0,.13);bell(n+4,.04,.12);nz(A.ctx.currentTime+.02,.5,.05,'highpass',6000,.5)},
  grow(){const t0=A.ctx.currentTime+.05;osc('triangle',noteF(4),t0,.35,.08,noteF(9))},
  cut(){nz(A.ctx.currentTime,.09,.3,'highpass',2600,.7)},
  miss(){const t0=A.ctx.currentTime;osc('triangle',480,t0,.9,.22,70);nz(t0,.4,.08,'lowpass',500)},
  complete(){for(let k=0;k<8;k++)bell(3+k,k*.06,.14);for(const n of[10,12,14])bell(n,.55,.12)},
  unlock({delay=0}){bell(7,delay,.14);bell(11,delay+.12,.14)},
  record(){for(let k=0;k<5;k++)bell(6+k,k*.05,.12)},
  master(){for(let k=0;k<6;k++)bell(5+k*2,k*.07,.12)},
  achievement(){bell(9,0,.11);bell(11,.08,.11);bell(13,.16,.11)},
  checkpoint(){bell(8,0,.13);bell(10,.08,.13)},
  daily(){SYNTH.complete()},
  ui(){osc('square',1200,A.ctx.currentTime,.05,.03)},

const SFX={play(ev,p){if(!A.ctx||SET.muted||SET.sfx<=0)return;try{const b=A.buf[ev];if(b){const r=voice(.6,A.ctx.currentTime,b.duration);if(!r)return;const s=A.ctx.createBufferSource();s.buffer=b;r[0].gain.value=r[1];s.connect(r[0]);s.start();return}SYNTH[ev]&&SYNTH[ev](p)}catch(e){}}};

// haptics: Vibration API where it exists (most Android browsers); elsewhere the visual pulse is the feedback
const HAPTIC={ok:typeof navigator.vibrate==='function',pat:{place:6,perfect:12,triple:[16,40,22],grow:[8,30,8],cut:10,miss:[40,40,70],complete:[25,40,25,40,60],master:[20,30,20,30,20]},
  fire(ev){if(!SET.haptics||!this.ok)return;const p=this.pat[ev];if(p==null)return;try{navigator.vibrate(p)}catch(e){}}};
for(const ev of Object.keys(HAPTIC.pat))BUS.on(ev,()=>HAPTIC.fire(ev));
// dynamic music: generated pad + bass; arpeggio joins on a perfect streak, hi-hats near the goal
const MUSIC={on:false,next:0,step:0,inten:0,
  start(){if(!A.ctx)return;if(!this.on){this.on=true;this.next=A.ctx.currentTime+.15;this.step=0}},
  stop(){this.on=false},
  pad(f,t0,dur){const C=A.ctx;const g=C.createGain();const lp=C.createBiquadFilter();lp.type='lowpass';lp.frequency.value=900;g.connect(lp);lp.connect(A.music);

    for(const d of[1,1.004]){const o=C.createOscillator();o.type='triangle';o.frequency.value=f*d;o.connect(g);o.start(t0);o.stop(t0+dur+.05)}},
  blip(f,t0,dur,vol,type='sine'){const C=A.ctx;const g=C.createGain();g.connect(A.music);g.gain.setValueAtTime(0,t0);g.gain.linearRampToValueAtTime(vol,t0+.01);g.gain.exponentialRampToValueAtTime(.0003,t0+dur);const o=C.createOscillator();o.type=type;o.frequency.value=f;o.connect(g);o.start(t0);o.stop(t0+dur+.03)},
  hat(t0){const C=A.ctx;const s=C.createBufferSource();s.buffer=A.noise;const f=C.createBiquadFilter();f.type='highpass';f.frequency.value=7000;const g=C.createGain();g.gain.setValueAtTime(.025,t0);g.gain.exponentialRampToValueAtTime(.0003,t0+.05);s.connect(f);f.connect(g);g.connect(A.music);s.start(t0,Math.random()*.4);s.stop(t0+.06)},
  tick(){if(!this.on||!A.ctx||A.ctx.state!=='running'||SET.muted||SET.music<=0)return;const BEAT=.25;
    while(this.next<A.ctx.currentTime+.3){this.sched(this.next,this.step);this.next+=BEAT;this.step++}},
  sched(t0,s){const PROG=[[0,4,7],[9,12,16],[5,9,12],[7,11,14]];const ch=PROG[Math.floor(s/16)%4];const root=130.81*WD.tune;const fq=x=>root*Math.pow(2,x/12);

// =====================================================================
// 7. GAME STATE & RULES (original stacking rules kept; nothing here pauses the run)
// =====================================================================
let blocks=[],cur=null,pieces=[],parts=[],rings=[],floats=[],fx2=[],phase='menu',camY=0,zoom=1,zoomT=1,camT=0,clock=0,shake=0,flashA=0,sweepT=0;
let baseY=600,streak=0,bestStreak=0,perfects=0,firstTap=true,overTimer=0,lastDrop=0,lastFrame=performance.now();
let mode='world',goalDone=false,runStars=0,cpSnap=null,cpUsed=false,assisted=false,recordBanner=false,runStartBest=0,runAch=[],runUnlocked=-1;
let dailyTask=null,dailyDone=false,pausedFrom='play';
const floors=()=>blocks.length-1;
function setWorld(i){wi=clamp(i,0,NW-1);WD=WORLDS[wi];galaxy=null;loadArt(WD);applyWorld()}
function newRun(){
  blocks=[{c:0,w:MAXW,land:0,gold:false,base:true,i:0,po:-MAXW/2,flash:0}];pieces=[];parts=[];rings=[];floats=[];fx2=[];
  streak=0;bestStreak=0;perfects=0;camY=0;zoom=1;zoomT=1;overTimer=0;baseY=G0;
  runStartBest=mode==='world'?SAVE.worlds[wi].best:((SAVE.daily[today()]||{}).best||0);
  goalDone=false;runStars=0;cpSnap=null;cpUsed=false;assisted=false;recordBanner=false;dailyDone=false;runAch=[];runUnlocked=-1;
  SKYJ.reset();bq.length=0;spawn();phase='play';lastDrop=performance.now();
  show(null);closeSheets();$('hud').hidden=false;$('pauseBtn').hidden=false;$('tip').hidden=!firstTap;$('streak').textContent='';
  hud();calcFocus();MUSIC.start();
}
function spawn(){
  const i=blocks.length,prev=blocks[i-1];const side=i%2?-1:1;
  cur={c:side*Math.min(AREA*.55,W/2-prev.w*.25),w:prev.w,dir:-side,i,gold:i%10===0};
}
function speed(){const f=floors();let m=WD.speed+Math.min(f,WD.cap)*WD.ramp;if(WD.wave)m*=1+WD.wave*Math.sin(f*1.3);return AREA*Math.min(MAXMUL,m)}
function tolerance(){return Math.max(3,MAXW*.022)*WD.tol}
// frame-rate independent movement; overshoot at the edge is reflected, so 30/60/120 Hz give the same path
function advanceCur(dt){if(!cur)return;cur.c+=cur.dir*speed()*dt;const b=Math.min(AREA*.55,W/2-cur.w*.25);
  for(let k=0;k<4;k++){if(cur.c>b){cur.c=2*b-cur.c;cur.dir=-1}else if(cur.c<-b){cur.c=-2*b-cur.c;cur.dir=1}else break}}
function drop(lat=0){
  if(phase!=='play')return;
  const now=performance.now();if(now-lastDrop<150)return;lastDrop=now;     // no accidental double taps
  if(lat>0)advanceCur(Math.min(lat,.05));                                     // where the block really was when the finger landed
  firstTap=false;$('tip').hidden=true;
  const prev=blocks[blocks.length-1],dx=cur.c-prev.c;
  const yb=blocks.length*BH,rm=RM();
  if(Math.abs(dx)<=tolerance()){
    cur.c=prev.c;streak++;perfects++;bestStreak=Math.max(bestStreak,streak);SAVE.profile.perfects++;
    let grow=0;const w0=cur.w;if(streak>=3&&cur.w<MAXW){grow=Math.min(MAXW-cur.w,MAXW*.07);cur.w+=grow}
    const pc=cur.c,pw=cur.w,pg=cur.gold;
    place(pc-pw/2,true);
    BUS.emit('perfect',{n:streak-1,gold:pg});
    rings.push({c:pc,w:pw,y:yb,l:1});
    sparkle(pc,yb+BH,pw,rm?8:(grow?30:18));
    if(!rm)flashA=Math.max(flashA,.1);
    if(streak%3)floats.push({x:pc,y:yb+BH*1.7,t:t('perfect'),l:.7,c:'#ffffff',s:.38});
    if(grow){BUS.emit('grow');rings.push({c:pc,w0,w:pw,y:yb,l:1.2,grow:true});floats.push({x:pc,y:yb+BH*2.6,t:t('widthUp',Math.round(grow/MAXW*100)),l:1.1,c:'#7ef2d0',s:.4})}
    if(streak%3===0){BUS.emit('triple',{n:streak});sweepT=1;if(!rm)flashA=.22;floats.push({x:pc,y:yb+BH*3.4,t:streak===3?t('triple'):t('streakX',streak),l:1.2,c:'#ffcf4a',s:.75});sparkle(pc,yb+BH,pw*1.4,rm?10:34)}
    $('streak').textContent=t('streakHud',streak);
    shake=rm?0:2;afterPlace();return;
  }
  const overlap=cur.w-Math.abs(dx);
  if(overlap<=0){
    pieces.push({x:cur.c,y:yb,w:cur.w,vx:cur.dir*60,vy:0,rot:0,vr:(Math.random()-.5)*3,i:cur.i,gold:cur.gold,pox:0});
    BUS.emit('miss');streak=0;phase='fall';overTimer=0;cur=null;$('streak').textContent='';hud();return;
  }
  const po=cur.c-cur.w/2;
  const L=Math.max(cur.c-cur.w/2,prev.c-prev.w/2),R=Math.min(cur.c+cur.w/2,prev.c+prev.w/2);

  place(po,false);BUS.emit('cut');BUS.emit('place',{ratio:overlap/MAXW});shake=rm?0:4;
  afterPlace();
}
function place(po,perfect){
  blocks.push({c:cur.c,w:cur.w,land:perfect?0:1,ss:perfect?1:0,gold:cur.gold,i:cur.i,po,flash:perfect?1:0});
  SAVE.profile.floors++;spawn();hud();
  const fl=$('floors');fl.classList.remove('bump');void fl.offsetWidth;fl.classList.add('bump');
}
function afterPlace(){
  const f=floors();SKYJ.onFloor(f);
  if(mode==='world'){
    if(!goalDone&&f>=WD.goal)completeLevel();
    else if(!goalDone&&f===WD.goal-5&&WD.goal>=20)banner(t('fiveMore'),wname(wi),'#7ef2d0');
    if(WD.cp&&!goalDone&&!cpSnap&&f===WD.cp){cpSnap=blocks.map(b=>({...b,land:0,flash:0,ss:0}));banner(t('checkpoint'),t('cpSub'),'#7ef2d0');BUS.emit('checkpoint')}
    if(goalDone&&!assisted&&!recordBanner&&f>runStartBest&&runStartBest>=WD.goal){recordBanner=true;banner(t('newRecord'),t('floorsN',f),'#ffcf4a');BUS.emit('record')}
    if(!assisted&&!SAVE.worlds[wi].master){const m=masterOf(wi);if(f>=m.floors&&(!m.perfects||perfects>=m.perfects)&&(!m.streak||bestStreak>=m.streak)){SAVE.worlds[wi].master=true;writeSave();banner(t('master'),masterText(m),'#ffcf4a');BUS.emit('master')}}
  }else if(mode==='daily'&&!dailyDone&&dailyMet()){
    dailyDone=true;const d=SAVE.daily[today()]||(SAVE.daily[today()]={done:false,best:0,perf:0});d.done=true;writeSave();
    banner(t('dailyDone'),t('keepGoing'),'#7ef2d0');celebrate();BUS.emit('daily');
  }

  SAVE.profile.runs++;SAVE.profile.bestStreak=Math.max(SAVE.profile.bestStreak,bestStreak);writeSave();checkAch();

function makeDaily(dstr){
  const r=mulberry(hashStr('egig-'+dstr));const r1=r();const locked=WORLDS.map((_,i)=>i).filter(i=>i>=SAVE.unlocked);
  const w=locked.length?locked[Math.floor(r1*locked.length)]:Math.floor(r1*NW);const ty=Math.floor(r()*3);   // the setting is always one of the player's locked worlds
  if(ty===0)return{w,type:'floors',n:15+5*Math.floor(r()*4)};
  if(ty===1)return{w,type:'perf',p:4+Math.floor(r()*4)};
  return{w,type:'streak',n:12+3*Math.floor(r()*3),s:3};
}

function renderThumb(c,i,locked){
  const g=c.getContext('2d'),w=c.width,h=c.height,wd=WORLDS[i];g.setTransform(1,0,0,1,0,0);g.clearRect(0,0,w,h);
  const gy=h*.8;
  if(locked){g.fillStyle='#231b40';g.fillRect(0,0,w,h)}
  else{const sk=wd.classic?['#3b2a6b','#ffb38a']:[wd.sky[0],wd.sky[1]];const gr=g.createLinearGradient(0,0,0,h);gr.addColorStop(0,sk[0]);gr.addColorStop(1,sk[1]);g.fillStyle=gr;g.fillRect(0,0,w,h)}
  if(!wd.classic)wd.layers.slice(0,2).forEach((L,k)=>{if(L[0]==='none')return;const lh=Math.round(h*(k?.5:.65));const col=locked?(k?'#2f2752':'#2a2249'):L[1];const t=document.createElement('canvas');t.width=w;t.height=lh;const tg=t.getContext('2d');tg.fillStyle=col;SIL[L[0]](tg,w,lh,mulberry(i*31+k*7+3),col,locked?null:L[2]);g.drawImage(t,0,gy-lh+2)});
  g.fillStyle=locked?'#2f2752':wd.classic?'#2f5fa8':wd.ground[1]==='none'?'rgba(0,0,0,0)':wd.ground[0];g.fillRect(0,gy,w,h-gy);
  const bh=h*.07,bw0=w*.42;
  for(let k=0;k<7;k++){const bw=bw0*(1-k*.04),x=w/2-bw/2+Math.sin(k*1.7+i)*w*.012,y=gy-(k+1)*bh;
    if(locked){g.fillStyle='#3a3060';g.fillRect(x,y,bw,bh-1)}
    else if(k===0){g.fillStyle=wd.classic?'#5b4a7a':darker(wd.ped[0]==='ring'||wd.ped[0]==='cloud'?'#9a9ab8':wd.ped[1],.85);g.fillRect(x,y,bw,bh)}
    else{const sv=WD;WD=wd;try{paintBlock(g,wd,x,y,bw,bh,{i:k,gold:false,ox:x,flash:0})}finally{WD=sv}}}
  if(locked){const cx=w/2,cy=h*.42;g.fillStyle='rgba(255,255,255,.75)';g.fillRect(cx-16,cy-4,32,26);g.strokeStyle='rgba(255,255,255,.75)';g.lineWidth=5;g.beginPath();g.arc(cx,cy-6,11,Math.PI,0);g.stroke();g.fillStyle='#231b40';g.fillRect(cx-2.5,cy+4,5,10)}
}

$('bExport').onclick=()=>{const ta=$('exportTxt');ta.value=exportSave();ta.hidden=false;ta.select();
  const ok=()=>{$('importMsg').textContent=t('copied')},bad=()=>{$('importMsg').textContent=t('copyFail')};
  try{navigator.clipboard.writeText(ta.value).then(ok,bad)}catch(e){bad()}};

  if(performance.now()-importArm>5000){importArm=performance.now();$('importMsg').textContent=t('importConfirm');return}
  importArm=0;if(importSave(v)){LANG=SET.lang||detectLang();applyI18n();applyVolumes();document.documentElement.classList.toggle('rm',RM());$('importMsg').textContent=t('importOk');setTimeout(()=>{closeSheets();showMenu()},600)}else $('importMsg').textContent=t('importBad')};
// background / return: the run freezes only when the app is hidden, and waits for the player
document.addEventListener('visibilitychange',()=>{
  if(document.hidden){pause();writeSave();if(A.ctx&&A.ctx.state==='running')A.ctx.suspend().catch(()=>{})}
  else{if(A.ctx&&A.ctx.state==='suspended')A.ctx.resume().catch(()=>{});last=performance.now()}

addEventListener('pagehide',()=>writeSave());

// =====================================================================
// 9. LOOP
// =====================================================================
let last=performance.now(),ftAcc=0,ftN=0;
function frame(now){
  const rdt=Math.min(.05,Math.max(0,(now-last)/1000));last=now;lastFrame=now;
  if(phase==='play'||phase==='fall'){ftAcc+=rdt;ftN++;if(ftN>=150){if(!lowFx&&ftAcc/ftN>1/40){lowFx=true;buildAmb()}ftAcc=0;ftN=0}}
  if(phase!=='pause'){clock+=rdt;update(rdt)}
  pumpQueues(now);MUSIC.tick();draw();requestAnimationFrame(frame);
}
function update(dt){
  if(phase==='play')advanceCur(dt);
  for(const b of blocks){if(b.land>0)b.land=Math.max(0,b.land-dt*5);if(b.ss>0)b.ss=Math.max(0,b.ss-dt/.26);if(b.flash>0)b.flash=Math.max(0,b.flash-dt*3.5)}
  for(const p of pieces){p.vy-=1700*dt;p.x+=p.vx*dt;p.y+=p.vy*dt;p.rot+=p.vr*dt}
  pieces=pieces.filter(p=>p.y>camY-H*1.5/zoom);
  for(const p of parts){p.x+=p.vx*dt;p.y+=p.vy*dt;p.vy-=300*dt;p.l-=dt/p.d;p.rot+=dt*4}parts=parts.filter(p=>p.l>0);
  for(const r of rings)r.l-=dt*(r.grow?1.6:2.2);rings=rings.filter(r=>r.l>0);
  for(const f of floats){f.l-=dt*.9;f.y+=dt*BH*1.2}floats=floats.filter(f=>f.l>0);
  for(const p of fx2){if(p.delay>0){p.delay-=dt;continue}p.vy+=p.g*dt;p.x+=p.vx*dt;p.y+=p.vy*dt;p.vx*=Math.exp(-.6*dt);p.rot+=p.vr*dt;p.l-=dt}fx2=fx2.filter(p=>p.l>0);
  if(WD.classic)for(const c of clouds){c.x+=c.v*dt;if(c.x>W)c.x=-W;if(c.x<-W)c.x=W}
  updAmb(dt);SKYJ.update(dt,floors());
  const top=blocks.length*BH,fallen=phase==='over'||phase==='fall'&&overTimer>.7;
  if(phase==='fall'){overTimer+=dt;if(overTimer>.7){const th=top+BH*4;zoomT=Math.min(1,FOC/th)}if(overTimer>1.5)gameOver()}
  camT=fallen?0:Math.max(0,top-(G0-FOC));
  if(phase==='play'||phase==='menu')zoomT=1;
  camY+=(camT-camY)*ease(fallen?2.5:6,dt);
  zoom+=(zoomT-zoom)*ease(2.5,dt);
  baseY+=((fallen?H*.9:G0)-baseY)*ease(2.5,dt);
  shake=Math.max(0,shake-dt*25);flashA=Math.max(0,flashA-dt*1.6);sweepT=Math.max(0,sweepT-dt*1.4);
}
const sx=x=>W/2+x*zoom;
const sy=y=>baseY-(y-camY)*zoom;
function draw(){
  const g=ctx;g.setTransform(DPR,0,0,DPR,0,0);const rm=RM();
  // 1 sky gradient (by tower height) · 2 far stars, planets, nebulae · 3 scenery and clouds · 4 moving objects · 5 tower · 6 effects · 7 HUD (DOM)
  if(WD.classic){drawClassicBg(g,SKYJ.h);SKYJ.draw(g,'far')}
  else{
    const[st,sb,sa]=SKYJ.sky();
    const sg=g.createLinearGradient(0,0,0,H);sg.addColorStop(0,st);sg.addColorStop(1,sb);g.fillStyle=sg;g.fillRect(0,0,W,H);
    drawStars(g,Math.max(WD.night?.6:0,sa));
    SKYJ.draw(g,'far');
    const ea=['sun','redsun','godrays','rainbow','lamps','lavaglow','blimp','cave'].includes(WD.extra)?SKYJ.earthFade():1;
    if(ea>.01)drawExtra(g,camY*zoom*.04,ea);
    const gy=sy(-BH*1.2);
    layers.forEach((L,k)=>{if(!L||(lowFx&&k===2))return;const by=gy-(camY*zoom)*(1-LAYER_F[k])+4;if(by-L.h>H)return;g.drawImage(L.c,0,by-L.h,W,L.h)});
  }
  SKYJ.drawWater(g);SKYJ.draw(g,'env');drawAmb(g);SKYJ.draw(g,'move');
  g.save();if(!rm&&shake>0)g.translate((Math.random()-.5)*shake,(Math.random()-.5)*shake);
  if(WD.classic)drawClassicFront(g);
  else{const gy=sy(-BH*1.2);drawGround(g,gy);drawPed(g,sy(0),gy)}
  const h=BH*zoom;
  // previous record height, shown while it is still ahead
  if((phase==='play'||phase==='fall'||phase==='pause')&&runStartBest>0&&floors()<=runStartBest+2){
    const y=sy((runStartBest+1)*BH);if(y>-20&&y<H+20){g.strokeStyle='rgba(255,255,255,.65)';g.lineWidth=1.5;g.setLineDash([8,7]);g.lineDashOffset=-clock*12;g.beginPath();g.moveTo(0,y);g.lineTo(W,y);g.stroke();g.setLineDash([]);
      g.font='700 11px Outfit, system-ui, sans-serif';g.textAlign='left';g.textBaseline='bottom';const tx=t('recordLine',runStartBest);g.fillStyle='rgba(23,15,51,.55)';const tw=g.measureText(tx).width;g.fillRect(14,y-18,tw+12,16);g.fillStyle='#fff';g.fillText(tx,20,y-4)}}
  // tower
  for(let k=0;k<blocks.length;k++){const b=blocks[k];const y=sy(k*BH);if(y<-BH*2||y-h>H+BH)continue;
    const x=sx(b.c-b.w/2),ww=b.w*zoom;
    if(b.base){paintBase(g,WD,x,y-h,ww,h);continue}
    let hh=h,www=ww,xx=x;
    if(b.ss>0){const tt=1-b.ss,amp=rm?.07:.16;const s=1-amp*Math.sin(tt*Math.PI*2)*(1-tt);hh=h*s;www=ww*(1+(1-s)*.6);xx=x-(www-ww)/2}   // squash & stretch, visual only
    else if(b.land>0){const sq=b.land*.12;hh=h*(1-sq);xx=x-ww*sq*.25;www=ww*(1+sq*.5)}
    b.ox=sx(b.po);paintBlock(g,WD,xx,y-hh,www,hh,b);
    if(b.flash>0&&!rm){g.globalCompositeOperation='lighter';g.fillStyle=`rgba(255,240,200,${b.flash*.5})`;g.fillRect(xx,y-hh-2,www,3);g.globalCompositeOperation='source-over'}}
  if(sweepT>0&&!rm){const n=Math.min(blocks.length-1,7);for(let k=0;k<n;k++){const idx=blocks.length-1-k,b=blocks[idx];const a=clamp(sweepT*1.6-k*.18,0,1)*.5;if(a<=0)continue;g.fillStyle=`rgba(255,240,200,${a})`;g.fillRect(sx(b.c-b.w/2),sy(idx*BH)-h,b.w*zoom,h)}}
  if(cur&&(phase==='play'||phase==='pause')){const x=sx(cur.c-cur.w/2);cur.ox=x;paintBlock(g,WD,x,sy(blocks.length*BH)-h,cur.w*zoom,h,cur);
    const prev=blocks[blocks.length-1];g.fillStyle='rgba(255,255,255,.18)';g.fillRect(sx(prev.c-prev.w/2),sy(blocks.length*BH)-2,prev.w*zoom,2)}
  for(const p of pieces){g.save();g.translate(sx(p.x),sy(p.y)-h/2);g.rotate(p.rot);const w=p.w*zoom;p.ox=-w/2+p.pox*zoom;paintBlock(g,WD,-w/2,-h/2,w,h,p);g.restore()}
  g.globalCompositeOperation='lighter';
  for(const r of rings){if(r.grow){const x0=sx(r.c-r.w0/2),x1=sx(r.c-r.w/2),x2=sx(r.c+r.w0/2),x3=sx(r.c+r.w/2),y=sy(r.y)-h/2,e=(1-r.l/1.2)*16;
      g.fillStyle=`rgba(126,242,208,${Math.min(1,r.l)})`;for(const[xa,dir]of[[x1-e,-1],[x3+e,1]]){g.beginPath();g.moveTo(xa+dir*9,y);g.lineTo(xa,y-7);g.lineTo(xa,y+7);g.fill()}g.fillRect(x1,y-h/2-3,x0-x1,2.5);g.fillRect(x2,y-h/2-3,x3-x2,2.5);continue}
    const e=1-r.l,pad=e*(rm?10:22);g.strokeStyle=`rgba(255,240,200,${r.l})`;g.lineWidth=3*r.l+.5;g.strokeRect(sx(r.c-r.w/2)-pad,sy(r.y)-h-pad,r.w*zoom+pad*2,h+pad*2)}
  for(const p of parts){g.globalAlpha=Math.max(0,p.l);shape(g,p.sh,sx(p.x),sy(p.y),p.r,p.sh==='spark'?Math.atan2(-p.vy,p.vx):p.rot,p.c)}
  g.globalAlpha=1;g.globalCompositeOperation='source-over';
  g.textAlign='center';g.textBaseline='middle';
  for(const f of floats){g.globalAlpha=clamp(f.l,0,1);g.font=`400 ${Math.round(BH*f.s*1.6)}px Bungee, system-ui, sans-serif`;g.fillStyle='rgba(23,15,51,.5)';g.fillText(f.t,sx(f.x)+1,sy(f.y)+2);g.fillStyle=f.c;g.fillText(f.t,sx(f.x),sy(f.y))}
  g.globalAlpha=1;g.restore();
  for(const p of fx2){if(p.delay>0)continue;g.globalAlpha=clamp(p.l,0,1);shape(g,p.sh,p.x,p.y,p.r,p.sh==='spark'?Math.atan2(p.vy,p.vx):p.rot,p.c)}
  g.globalAlpha=1;
  if(flashA>0&&!rm){g.fillStyle=`rgba(255,250,235,${flashA})`;g.fillRect(0,0,W,H)}
}

requestAnimationFrame(frame);
})();
</script>
