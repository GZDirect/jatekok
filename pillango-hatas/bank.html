.mood{font-family:var(--display);font-size:13.5px;letter-spacing:.03em;background:var(--panel);border:1px solid var(--line);border-radius:999px;padding:3px 10px;color:var(--muted);transition:color .2s,border-color .2s}
.mood.go{color:var(--good);border-color:rgba(95,224,142,.5)}
.mood.run{color:var(--warm);border-color:rgba(255,183,100,.6)}
.vsep{width:1px;align-self:stretch;margin:6px 2px;background:var(--line)}

.lines p:first-child{color:var(--ink);transition:opacity .6s}

  border-radius:8px;padding:6px 10px;font-size:13px;color:var(--ink);pointer-events:none;white-space:nowrap;transition:opacity .2s}

#endcard p{margin:0;color:var(--muted);font-size:14px;line-height:1.4}
#endcard button{justify-content:center;width:100%}
@media (prefers-reduced-motion:reduce){.status h1 i{animation:none}}
</style>

const screens = [], ceilingPanels = [], streetLamps = [];
// ================= textures
function canvasTex(w, h, draw, rep=[1,1]){
  const c = document.createElement('canvas'); c.width = w; c.height = h; draw(c.getContext('2d'), w, h);
  const t = new THREE.CanvasTexture(c); t.colorSpace = THREE.SRGBColorSpace; t.wrapS = t.wrapT = THREE.RepeatWrapping; t.repeat.set(...rep);

}
const brickTex = canvasTex(256, 256, (x,w,h) => {
  x.fillStyle = '#3b2622'; x.fillRect(0,0,w,h);
  const bh = 16, bw = 48;
  for (let r=0; r<h/bh; r++) for (let c=-1; c<w/bw+1; c++){
    const off = r%2 ? bw/2 : 0, v = rnd(-14,14);

    x.fillRect(c*bw+off+2, r*bh+2, bw-4, bh-4);
  }
});
const brickDark = canvasTex(256, 256, (x,w,h) => {
  x.fillStyle = '#1d2230'; x.fillRect(0,0,w,h);
  for (let r=0; r<16; r++) for (let c=-1; c<7; c++){ const v = rnd(-8,8); x.fillStyle = `rgb(${54+v},${60+v},${78+v})`; x.fillRect(c*48+(r%2?24:0)+2, r*16+2, 44, 12); }
});
const woodTex = canvasTex(256, 256, (x,w,h) => {
  for (let r=0; r<8; r++){ const v = rnd(-12,12); x.fillStyle = `rgb(${120+v},${84+v},${56+v})`; x.fillRect(0, r*32, w, 31);
    x.fillStyle = 'rgba(0,0,0,.25)'; x.fillRect(rnd(0,w), r*32, 2, 32); }
}, [2,2]);
const tileTex = canvasTex(128, 128, (x,w,h) => { x.fillStyle = '#c9ccd0'; x.fillRect(0,0,w,h); x.fillStyle = '#9da2aa';
  for (let i=0;i<4;i++) for (let j=0;j<4;j++) if ((i+j)%2) x.fillRect(i*32, j*32, 32, 32); }, [3,3]);
const asphaltTex = canvasTex(256, 256, (x,w,h) => { x.fillStyle = '#16181d'; x.fillRect(0,0,w,h);
  for (let i=0;i<2500;i++){ const v = rnd(18,40); x.fillStyle = `rgb(${v},${v},${v+4})`; x.fillRect(rnd(0,w), rnd(0,h), 2, 2); } }, [6,2]);

  g.addColorStop(0,'rgba(255,255,255,1)'); g.addColorStop(.35,'rgba(255,255,255,.35)'); g.addColorStop(1,'rgba(255,255,255,0)'); x.fillStyle = g; x.fillRect(0,0,w,h); });

// box with UVs scaled to metres so textures tile evenly
function tbox(w, h, d, mats, tile=2){

}
const std = (c, r=0.8, m=0, extra={}) => new THREE.MeshStandardMaterial({color:c, roughness:r, metalness:m, flatShading:true, ...extra});

// ================= lights
const hemi = new THREE.HemisphereLight(0x4a5a90, 0x0a0b12, 0.75); scene.add(hemi);

box(30, 0.14, 1.3, concrete, 0, 0.07, 12.85, world);                                 // far sidewalk

box(30, 0.05, 3.8, std(0x1d2027, 0.6, 0.2), 0, 0.0, -7.9, world);                    // alley
box(4.6, 0.05, 15.6, std(0x23262d, 0.5, 0.2), 12.6, 0.0, 0.0, world);                // side car park

}

// ================= the bank (one storey, 20 × 12 m)
const bank = new THREE.Group(); scene.add(bank);
const WH = 4.2, PH = 2.9;
const walls = [];
const brick = std(0xffffff, 0.92, 0, {map:brickTex, flatShading:false});
const stone = std(0x9c968c, 0.85);
const paintLobby = std(0xd9d4c8), paintBack = std(0xc4ccd2), paintVault = std(0x8d9399), paintSec = std(0x6f7f8c);

const glassIn = std(0xd8ecff, 0.05, 0.2, {transparent:true, opacity:0.22});

function streaks(n, box3, len, color, op){

  const l = new THREE.LineSegments(g, new THREE.LineBasicMaterial({color, transparent:true, opacity:op, toneMapped:false})); l.visible = false; l.userData = {n, len, top:box3[4]}; scene.add(l); return l;
}

}
function backToPost(r){

  if (r === robbers.P){ r.look = 'work'; r.p.set(S.vaultOpen ? 'crouch' : 'work'); r.p.look(-7, -3.8); }
  if (r === robbers.G){ r.look = 'monitors'; r.p.set('sit'); r.p.look(-7.7, 6); if (!env.power) wait(600).then(patrol); }

}
function lockBlocked(r){ bLock.visible = true; bLock.position.set(r.p.g.position.x, 2.6, r.p.g.position.z); wait(1500).then(() => bLock.visible = false);
  Snd.play('clunk'); bump(3); log(`${r.a === 'az' ? 'Az' : 'A'} ${r.name} az ajtót rángatja, de a központi zár nem engedi.`); }

// guard patrols when the screens go dark
let patrolDir = 0;
async function patrol(){
  const G = robbers.G;
  if (!free(G) && G.look !== 'patrol') return;
  if (env.power || S.ended || S.fleeing) return;
  const pts = [[7.2, 4.6], [6.0, -4.4]], to = pts[patrolDir = 1 - patrolDir];
  const gen = ++G.gen;
  if (!reachable(pos2(G.p), to)){ G.look = 'room'; G.p.set('idle'); return; }
  G.look = 'patrol'; G.p.set('idle');
  await G.p.go(route(pos2(G.p), to), 1.2); if (gen !== G.gen) return;
  G.look = 'room'; G.p.set('idle'); G.p.look(to[1] > 0 ? 4 : 3, to[1] > 0 ? 2 : -1);
  await wait(5000); if (gen !== G.gen) return;
  if (!env.power) patrol(); else { G.look = 'walk'; await G.p.go(route(pos2(G.p), G.home), 1.5); if (gen === G.gen) backToPost(G); }
}

// ---- who sees what
const monitorsActive = () => env.power && !env.cctv && robbers.G.look === 'monitors' && zoneOf(robbers.G.p) === 'sec';
function covered(rt){
  if (monitorsActive()) return 'a kamerákon figyeli az őr';
  for (const r of RB){
    const z = zoneOf(r.p), lk = r.look;
    const watching = lk === 'room' || lk === 'patrol' || lk === 'walk';
    if (rt === 'front' && ((watching && ['lobby','front','counter'].includes(z)) || (z === 'front' && lk === 'out'))) return `${r.a} ${r.name} figyeli az ügyfélteret`;
    if (rt === 'emerg' && watching && ['lobby','front','counter'].includes(z)) return `${r.a} ${r.name} figyeli az ügyfélteret`;
    if (rt === 'back' && ((watching && ['lobby','counter','back'].includes(z)) || z === 'back')) return z === 'back' ? `${r.a} ${r.name} a hátsó irodában van` : `${r.a} ${r.name} rálát a pultra`;
  }
  return null;
}
const dark = () => env.power ? 0 : (S.dusk > 0.5 ? 1 : 0.5);
function noise(rt){ return dark() + env.sprinkler + env.bell + env.pa + (S.loud > 0 ? 2 : 0) + (env.media ? 0.5 : 0) + ((rt === 'front' || rt === 'emerg') && env.rain ? 1 : 0) + (rt === 'back' && env.vent ? 1 : 0); }
function routeFor(h){
  const opts = [];
  if (h.grp === 'teller') opts.push('back');
  if (env.exit) opts.push('emerg');
  opts.push('front');
  let why = null;
  for (const rt of opts){
    if (rt === 'back' && env.lock){ why = why || 'a hátsó ajtó a központi zár miatt zárva'; continue; }
    if (rt === 'front' && env.shutter){ why = why || 'a redőny lezárja a bejáratot'; continue; }
    if (rt === 'front' && env.spot){ why = why || 'a reflektor fényében nem mernek a bejárathoz'; continue; }
    const c = covered(rt); if (c){ why = why || c; continue; }
    if (noise(rt) < 1){ why = why || 'túl nagy a csend, félnek, hogy meghallják'; continue; }
    return {rt};
  }
  return {why: why || 'nincs szabad kijárat'};
}
function hostageThink(dt){
  if (S.ended || S.breaching) return;
  let best = null, why = 'figyelik őket';
  if (!S.esc){
    const cand = S.inside.slice().sort((a,b) => b.c - a.c);
    for (const h of cand){ const o = routeFor(h); if (o.rt){ best = {h, rt:o.rt}; break; } else if (h === cand[0]) why = o.why; }
  }
  S.inside.forEach(h => { if (!best || best.h !== h) h.ready = Math.max(0, h.ready - dt*0.6); });
  if (best){ best.h.ready += dt * best.h.c * (1 + 0.6*dark()); if (best.h.ready >= 1.4) escape(best.h, best.rt); }
  if ((S.moodT -= dt) <= 0){ S.moodT = 0.25; const m = $('mood');
    if (S.esc){ m.textContent = 'Túszok: valaki most szökik!'; m.className = 'mood run'; }
    else if (!S.inside.length){ m.textContent = 'Túszok: mindenki kint van'; m.className = 'mood go'; }
    else if (best){ m.textContent = 'Túszok: alkalmat látnak (' + {front:'bejárat', emerg:'vészkijárat', back:'hátsó ajtó'}[best.rt] + ')'; m.className = 'mood go'; }
    else { m.textContent = 'Túszok: ' + why; m.className = 'mood'; } }
}
const SAFE = () => [11.0 + (S.out % 4)*0.6, 8.4 + Math.floor(S.out/4)*0.6];
async function escape(h, rt){
  h.ready = 0; const e = {h, rt, phase:'inside', caught:false, lucky:false}; S.esc = e;
  S.inside = S.inside.filter(x => x !== h); refresh();
  const sp = 1.4 + 0.5*dark(), P = h.p; P.set('idle');
  const inside = rt === 'back' ? [[1.0,-2.5],[1.0,-3.6],[6.0,-5.2]] : (h.grp === 'teller' ? [[9.0,-0.7],[9.0,0.9]] : []).concat(rt === 'emerg' ? [[8.8,3.0]] : [[3.0,5.3]]);
  log({front:'Egy túsz magától a bejárat felé oson!', emerg:'Egy túsz a vészkijárat felé kúszik!', back:'Egy banki dolgozó a hátsó ajtó felé indul!'}[rt]);
  await P.go(inside, sp); if (e.caught || S.ended) return;
  e.phase = 'out'; Snd.play(rt === 'emerg' ? 'clunk' : 'click');
  const out = rt === 'back' ? [[6,-6.7],[8.2,-6.9],[11.2,-6.6],[11.2,4.8]] : rt === 'emerg' ? [[10.7,3.0],[11.4,4.8]] : [[3,6.9],[8.6,8.0]];
  await P.go(out, 3.0); if (S.ended && !S.fleeing) return;
  await P.go([SAFE()], 3.0);
  P.look(12.6, 9.6); P.set('wave'); Snd.play('chime'); S.out++; S.esc = null; bump(-4); refresh();
  log(`Kijutott! (${S.out}/8 biztonságban)`);
  if (!S.inside.length) log(env.swat ? 'Bent már csak a rablók vannak. A kommandó készül.' : 'Minden túsz kint van. Kommandó nélkül senki nem megy be értük.');
}
function checkCatch(){
  const e = S.esc; if (!e || e.phase !== 'inside' || e.caught) return;
  const c = covered(e.rt); if (!c) return;
  if (dark() >= 1 && !e.lucky && Math.random() < 0.4){ e.lucky = true; log('A sötétben nem vették észre a mozgást.'); return; }
  e.caught = true; S.caughtN++; const P = e.h.p, d = P.done; P.path = []; P.done = null; d && d();
  bump(14); Snd.play('sting'); robbers.L.p.look(P.g.position.x, P.g.position.z);
  log('Rajtakapták a szökő túszt, vissza kellett ülnie. A rablók idegesebbek lettek.');
  e.h.c *= 0.85;
  P.go([e.h.home], 1.4).then(() => { if (S.ended) return; P.set('crouch'); P.look(1.4, 1.6); S.inside.push(e.h); S.esc = null; refresh(); });
}

function drawTimer(){

async function openVault(){
  S.vaultOpen = true; Snd.play('vault'); log('Kinyílt a páncélterem időzára! A Fúrós pakolni kezd.'); bump(-6);
  const P = robbers.P; ++P.gen; P.look = 'work'; S.packing = true;
  await P.p.go([[-6.0,-3.0],[-8.2,-3.6]], 1.4); P.p.set('crouch'); P.p.look(-9.3, -4.6);

function fleePath(r){
  const a = region(...pos2(r.p)), tail = [[1,-2.4],[1,-3.6],[6,-5.2],[6,-6.4]];
  if (a === 'sec') return [...DOORS.sec, [9,0.9], [9,-0.7], ...tail];
  if (a === 'vault') return [...DOORS.vault, ...tail];
  if (a === 'back') return [[6,-5.2],[6,-6.4]];
  return (pos2(r.p)[1] > 0 ? [[9,0.9],[9,-0.7]] : []).concat(tail);
}
async function tryFlee(){
  if (S.ended || S.breaching) return;
  S.fleeing = true; S.fleeTries++; RB.forEach(r => { ++r.gen; r.look = 'walk'; r.p.set('idle'); });
  log('A rablók a pénzzel a hátsó ajtó felé indulnak!'); refresh();
  if (env.lock){
    await wait(1500); RB.forEach(r => lockBlocked(r)); bump(12);
    log('A központi zár bezárta őket. Nem jutnak ki a sikátorba.');
    return fleeFailed();
  }
  await Promise.all(RB.map((r,i) => wait(i*300).then(() => r.p.go(fleePath(r), 2.3))));
  if (S.ended || S.breaching) return;
  if (env.alley){
    bump(14); Snd.play('sting'); log('A sikátorban rendőrautók várnak! A rablók visszahátrálnak az irodába.');
    await Promise.all(RB.map((r,i) => r.p.go([[4 + i*1.3, -4.4]], 2.0)));
    RB.forEach(r => { r.look = 'room'; r.p.set('point'); r.p.look(4, -1); });
    return fleeFailed();
  }
  // they make it to the van
  await Promise.all(RB.map((r,i) => r.p.go([[3.6 + (i-1)*0.7, -7.0]], 2.4)));
  RB.forEach(r => r.p.show = false);

  end('flee');
}
async function fleeFailed(){

  S.fleeing = false; S.fleeCool = 22; refresh();
  log(env.swat ? 'Csapdába kerültek. Ha még egyszer nem jutnak ki, megadják magukat.' : 'Csapdába kerültek, de kommandó nélkül nincs, aki elfogja őket.');
}
async function surrender(){
  S.breaching = true; log('A rablók belátták, hogy nincs kiút. Megadják magukat a kommandónak.');

  const saved = S.inside.length; freeAll(); await wait(1500); end('win', {surrender:true, saved});
}
function freeAll(){ const n = S.inside.length; S.inside.forEach((h,i) => { h.p.set('idle'); wait(i*250).then(() => h.p.go([[9,3],[10.7,3],[11.4,4.8],SAFE()], 2.6).then(() => { h.p.look(12.6,9.6); h.p.set('wave'); })); S.out++; }); S.inside = []; return n; }

  Snd.play('clang');
  swat.forEach(s => s.show = true);
  await Promise.all(swat.map((s,i) => wait(i*250).then(() => s.go([[11.6, 3.0],[10.7, 3.0],[8.6, 3.0 - i*0.5]], 2.6).then(() => { s.set('aim'); s.look(robbers.L.p.g.position.x, robbers.L.p.g.position.z); }))));
}
async function breach(forced){
  if (S.breaching || S.ended) return;
  S.breaching = true; RB.forEach(r => ++r.gen);
  const ok = !forced || !env.power || env.sprinkler || env.bell || S.loud > 0 || robbers.L.look !== 'room';

  if (ok){ Snd.play('clunk'); RB.forEach(r => { r.p.path = []; r.p.set('handsup'); }); const saved = freeAll(); await wait(1500); end('win', {forced, saved}); }

}

function simTick(dt, t){
  if (S.ended) return;
  let rate = -0.45;
  if (!env.power) rate += 1.0; if (env.spot) rate += 1.3; if (env.sprinkler) rate += 0.6; if (env.bell) rate += 1.2; if (env.drone) rate += 0.6;
  if (env.media) rate += 0.5; if (env.timelock) rate += 0.35; if (env.lock) rate += 0.5;
  if (env.pa) rate -= 0.5; if (env.vent) rate -= 0.2; if (env.rain) rate -= 0.2; if (env.shutter) rate -= 0.7;
  bump(rate*dt);
  S.loud = Math.max(0, S.loud - dt);
  // vault clock
  if (!S.vaultOpen){ S.vault -= dt * (env.power ? 1 : 0) * (env.timelock ? 0.35 : 1); if (S.vault <= 0){ S.vault = 0; openVault(); } }
  if ((S.timerT = (S.timerT || 0) - dt) <= 0){ S.timerT = 0.25; drawTimer(); }
  // periodic distractions
  const L = robbers.L;
  if (env.drone && free(L) && !S.busyEv){ S.droneT -= dt; if (S.droneT <= 0){ S.droneT = 12; log('A Vezér az üveghez megy, és a drónt figyeli.'); task(L, [5.0, 5.0], 'out', 4000, 'idle', [5, 9]); } }
  if (env.media && free(L) && !S.busyEv){ S.mediaT -= dt; if (S.mediaT <= 0){ S.mediaT = 15; log('A Vezér a tévét nézi: róluk szólnak a hírek.'); bump(2); task(L, [-2.4, 3.9], 'tv', 5000, 'idle', [-3.8, 3.9]); } }
  if (S.fleeCool > 0 && !S.fleeing){ S.fleeCool -= dt; if (S.fleeCool <= 0) tryFlee(); }
  hostageThink(dt); checkCatch();
  // commando decides
  if (env.swat && !S.breaching && !S.fleeing){
    if (!S.inside.length && !S.esc){ S.swatWait += dt; if (S.swatWait > 3) breach(false); }
    else if (S.T >= 95) breach(true);
  }
  if (S.T >= 100 && !S.breaching){ RB.forEach(r => { ++r.gen; r.p.path = []; r.p.set('panic'); }); end('lose', {}); }
  else if (S.T > 82 && t - S.lastWarn > 12){ S.lastWarn = t; log(env.swat ? 'Figyelem: kritikus feszültség! 95-nél a kommandó magától behatol.' : 'Figyelem: a rablók a végsőkig feszültek!'); }
}

    D.turn = D.turn === 'angel' ? 'demon' : 'angel'; D.phase = 'plan'; D.left = PLAN;
    log(`${NAME[D.turn]} következik.`); ui();
  }
  function tick(dt){
    if (!D.on || D.phase === 'over' || D.phase === 'off') return;
    const out = S.out, caught = S.caughtN || 0;
    if (out > D.seenOut){ const n = out - D.seenOut; D.sc.angel += 10*n; D.br.angel.save += 10*n; D.seenOut = out; }
    if (caught > D.seenCaught){ const n = caught - D.seenCaught; D.sc.demon += 6*n; D.br.demon.caught += 6*n; D.seenCaught = caught; }
    if (D.phase === 'plan'){ D.left -= dt; if (D.left <= 0){ log(`${NAME[D.turn]}: lejárt az idő, a lépés elveszett.`); resolve(null); } }
    else if (D.phase === 'resolve'){ D.res -= dt; if (D.res <= 0) endTurn(); }
    if ((D.uiT = (D.uiT || 0) - dt) <= 0){ D.uiT = 0.2; ui(); }
  }
  // called by the level when the situation ends
  function over(kind){
    if (!D.on) return false;
    tick(0); finish(kind); return true;
  }
  function finish(kind){
    D.phase = 'over';
    const B = {good:['angel', 25], risky:null, flee:['demon', 20], lose:['demon', 30]};
    if (kind === 'good'){ D.sc.angel += 25; D.br.angel.end = 25; }
    if (kind === 'risky'){ D.sc.angel += 12; D.br.angel.end = 12; D.sc.demon += 6; D.br.demon.end = 6; }
    if (kind === 'flee'){ D.sc.demon += 20; D.br.demon.end = 20; }
    if (kind === 'lose'){ D.sc.demon += 30; D.br.demon.end = 30; }
    if (!kind){ const left = S.inside.length + (S.esc ? 1 : 0); D.sc.demon += 5*left; D.br.demon.left = 5*left; }
    const a = D.sc.angel, d = D.sc.demon, win = a > d ? 'angel' : d > a ? 'demon' : null;
    const endTxt = {good:'Jó befejezés', risky:'Kockázatos behatolás', flee:'A tettesek meglógtak', lose:'A helyzet elfajult'}[kind] || 'Letelt a 8 kör';
    $('endcard').hidden = true;
    modal.innerHTML = `<div class="box"><h2 style="color:${win === 'angel' ? '#ffd76a' : win === 'demon' ? '#ff6a6a' : 'var(--ink)'}">${win ? (win === 'angel' ? 'Az Angyal nyert' : 'A Démon nyert') : 'Döntetlen'}</h2>
      <p>${endTxt}. ${S.out} túsz jutott ki.</p>
      <table><tr><th>Pont</th><th class="a">Angyal</th><th class="d">Démon</th></tr>
      <tr><td>Kijutott túszok / lebukott szökések</td><td>${D.br.angel.save}</td><td>${D.br.demon.caught}</td></tr>
      <tr><td>Nyugalom / káosz a lépések után</td><td>${D.br.angel.calm}</td><td>${D.br.demon.chaos}</td></tr>
      <tr><td>Végkimenetel</td><td>${D.br.angel.end}</td><td>${D.br.demon.end}</td></tr>
      <tr><td>Bent maradt túszok</td><td>0</td><td>${D.br.demon.left}</td></tr>
      <tr class="tot"><td>Összesen</td><td>${a}</td><td>${d}</td></tr></table>
      <div class="choices"><button class="duo" id="mAgain">Visszavágó</button><button id="mMode">Mód választása</button></div></div>`;
    modal.hidden = false; ui();
    $d('mAgain').onclick = () => { modal.hidden = true; start(); };
    $d('mMode').onclick = () => { D.on = false; bar.hidden = true; showMode(); };
  }
  function ui(){
    if (!D.on){ document.querySelectorAll('.ic.blocked').forEach(b => b.classList.remove('blocked')); return; }
    bar.className = D.turn + (D.phase === 'resolve' ? ' resolve' : '');
    $d('dWho').textContent = D.phase === 'over' ? 'Vége' : D.phase === 'resolve' ? `${NAME[D.turn]} lépett` : `${NAME[D.turn]} köre`;
    $d('dClk').textContent = D.phase === 'plan' ? `0:${String(Math.max(0, Math.ceil(D.left))).padStart(2,'0')}` : D.phase === 'resolve' ? `${Math.max(0, Math.ceil(D.res))}s` : '';
    $d('dRnd').textContent = Math.min(D.round, ROUNDS); $d('dA').textContent = D.sc.angel; $d('dD').textContent = D.sc.demon;
    $d('dPass').disabled = D.phase !== 'plan';
    const blocked = D.phase === 'plan' ? D.block[D.turn] : null;
    document.querySelectorAll('.ic').forEach(b => { b.classList.toggle('blocked', !!blocked && (b.id === 'env-'+blocked || b.id === 'ev-'+blocked)); if (D.phase !== 'plan' && D.phase !== 'off') b.disabled = true; });
    if (D.phase === 'plan') refresh();
    const dock = document.querySelector('.dock'); if (dock) document.documentElement.style.setProperty('--dockH', dock.offsetHeight + 'px');
  }
  bar.querySelector('#dPass').onclick = () => { if (D.phase === 'plan'){ log(`${NAME[D.turn]} passzolt.`); resolve(null); } };
  return {showMode, take, tick, paused, over, get on(){ return D.on; }, get blockedKey(){ return D.on && D.phase === 'plan' ? D.block[D.turn] : null; }};
})();
// ================= view controls
$('vL').onclick = () => thetaGoal -= Math.PI/2;
$('vR').onclick = () => thetaGoal += Math.PI/2;
$('vLvl').hidden = true;
addEventListener('keydown', e => { if (e.key === 'q' || e.key === 'ArrowLeft') $('vL').click(); if (e.key === 'e' || e.key === 'ArrowRight') $('vR').click(); });
const cv = renderer.domElement, ptrs = new Map(); let dragX = null, pinch0 = 0, zoom0 = 1;
cv.addEventListener('pointerdown', e => { cv.setPointerCapture(e.pointerId); ptrs.set(e.pointerId, e); if (ptrs.size === 1) dragX = e.clientX;
  if (ptrs.size === 2){ const [a,b] = [...ptrs.values()]; pinch0 = Math.hypot(a.clientX-b.clientX, a.clientY-b.clientY); zoom0 = cam.zoom; dragX = null; } });
cv.addEventListener('pointermove', e => { if (!ptrs.has(e.pointerId)) return; ptrs.set(e.pointerId, e);
  if (ptrs.size === 2){ const [a,b] = [...ptrs.values()]; setZoom(zoom0 * Math.hypot(a.clientX-b.clientX, a.clientY-b.clientY) / pinch0); }
  else if (dragX !== null && Math.abs(e.clientX - dragX) > 60){ thetaGoal += (e.clientX > dragX ? -1 : 1)*Math.PI/2; dragX = e.clientX; } });
const up = e => { ptrs.delete(e.pointerId); if (!ptrs.size) dragX = null; };
cv.addEventListener('pointerup', up); cv.addEventListener('pointercancel', up);
cv.addEventListener('wheel', e => { e.preventDefault(); setZoom(cam.zoom*(e.deltaY < 0 ? 1.1 : 0.9)); }, {passive:false});
function setZoom(z){ cam.zoom = THREE.MathUtils.clamp(z, 0.75, 3.2); cam.updateProjectionMatrix(); }

// ================= main loop
await document.fonts.ready;
$('loading').hidden = true;
reset(); Duel.showMode();
const clock = new THREE.Clock(); let simT = 0;
const DUSK = {sky:new THREE.Color(), sky0:new THREE.Color(0x4a3d58), sky1:new THREE.Color(0x07090f), h0:new THREE.Color(0xffc29a), h1:new THREE.Color(0x4a5a90),
  g0:new THREE.Color(0x7a5a50), g1:new THREE.Color(0x0a0b12), s0:new THREE.Color(0xff9a58), s1:new THREE.Color(0x8ea4ff)};
let tickUI = 0;
renderer.setAnimationLoop(() => {
  const dtR = Math.min(clock.getDelta(), 0.05), dt = Duel.paused() ? 0 : dtR; simT += dt; const t = simT;
  Duel.tick(dtR);
  theta += (thetaGoal - theta)*Math.min(1, dtR*7);
  cam.position.set(target.x + 50*Math.sin(theta)*Math.cos(PHI), target.y + 50*Math.sin(PHI), target.z + 50*Math.cos(theta)*Math.cos(PHI));
  cam.lookAt(target);
  const sx = Math.sin(theta), cz = Math.cos(theta);
  walls.forEach(w => { const goal = (w.nx*sx + w.nz*cz) > 0.25 ? 0.06 : 1; w.s += (goal - w.s)*Math.min(1, dtR*8); w.g.scale.y = w.s; if (w.band){ w.band.visible = w.s > 0.5; sign.visible = w.s > 0.5; } });
  { const goal = sx < -0.3 ? 0.12 : 1; nbBrick.opacity += (goal - nbBrick.opacity)*Math.min(1, dtR*6); nbBrick.depthWrite = nbBrick.opacity > 0.95;
    nb.children.forEach(c => { if (!Array.isArray(c.material)) c.visible = nbBrick.opacity > 0.5; }); }
  // power, screens, lights
  roomLights.forEach(l => { l.intensity += ((env.power ? 13 : 0) - l.intensity)*Math.min(1, dt*10); });
  screens.forEach(s => s.visible = env.power);
  monitors.forEach((m,i) => { m.visible = env.power; if (env.cctv) m.material.color.setHSL(0.33, 0.5, 0.3 + 0.05*Math.sin(t*3+i)); else m.material.color.setHex(robbers.G && S.esc && !env.cctv ? 0xff8a6a : 0x6ad6a0); });
  tvScreen.material.color.setHex(env.media ? (Math.floor(t*2)%2 ? 0xff5a5a : 0x5aa8ff) : 0x203040).multiplyScalar(env.power ? (env.media ? 1.6 : 0.5) : 0);
  signMat.color.setHex(0x9ad8ff).multiplyScalar(env.power ? 2.2 : 0.1);
  alarmLed.material.color.setHex(env.bell || S.fleeing ? (Math.floor(t*4)%2 ? 0xff2020 : 0x330000) : 0x5fe08e).multiplyScalar(2);
  blades.rotation.z += dt * (env.vent ? 14 : 0);
  // vault door + clock
  hinge.rotation.y += ((S.vaultOpen ? 1.7 : 0) - hinge.rotation.y)*Math.min(1, dt*0.9);
  wheel.rotation.x += S.vaultOpen && hinge.rotation.y < 0.3 ? dt*3 : 0;
  // facade gear
  shutters.forEach(sh => { const goal = env.shutter ? 1 : 0.001; sh.scale.y += (goal - sh.scale.y)*Math.min(1, dt*4); sh.position.y = sh.userData.top - sh.userData.h*sh.scale.y/2; });
  spot.intensity += ((env.spot ? 70 : 0) - spot.intensity)*Math.min(1, dt*6);
  beam.material.opacity = 0.06*(spot.intensity/70); lens.material.color.setHex(0xffffff).multiplyScalar(0.3 + 3*(spot.intensity/70));
  alleyBlock.visible = env.alley;
  rain.visible = env.rain; if (env.rain) fall(rain, dt, 16);
  mist.visible = env.sprinkler; if (env.sprinkler) fall(mist, dt, 5);
  // dusk: about four minutes of game time from sunset to full night
  if (!S.ended) S.dusk = Math.min(1, S.dusk + dt/240);
  { const k = S.dusk, e = k*k*(3-2*k);
    DUSK.sky.copy(DUSK.sky0).lerp(DUSK.sky1, e); renderer.setClearColor(DUSK.sky); scene.fog.color.copy(DUSK.sky);
    hemi.color.copy(DUSK.h0).lerp(DUSK.h1, e); hemi.groundColor.copy(DUSK.g0).lerp(DUSK.g1, e);
    hemi.intensity = THREE.MathUtils.lerp(1.7, 0.8, e) * (env.rain ? 0.75 : 1);
    moon.color.copy(DUSK.s0).lerp(DUSK.s1, e); moon.intensity = THREE.MathUtils.lerp(2.2, 0.75, e) * (env.rain ? 0.6 : 1);
    moon.position.set(THREE.MathUtils.lerp(-22, -8, e), THREE.MathUtils.lerp(10, 18, e), THREE.MathUtils.lerp(4, 10, e));
    const lampOn = THREE.MathUtils.smoothstep(k, 0.25, 0.55); streetLamps.forEach(l => l.intensity = 18*lampOn);
    const mins = 17*60 + 40 + Math.round(k*230); $('clock').textContent = `${Math.floor(mins/60)}:${String(mins%60).padStart(2,'0')}`; }
  drone.visible = env.drone; if (env.drone){ drone.position.set(5 + Math.sin(t*0.5)*1.5, 3.3 + Math.sin(t*1.7)*0.15, 8.2); props.forEach(p => p.rotation.y += dt*40); droneLed.forEach((d,i) => d.visible = Math.floor(t*2+i)%2 === 0); }
  media.visible = env.media; crowd.forEach(c => c.show = env.media);
  if (env.media && Math.random() < 0.012){ flash.intensity = 30; Snd.play('shutter'); } else flash.intensity *= 0.8;
  if (S.vanGo){ getaway.position.x += dt*9; }
  const ph = Math.floor(t*3.2)%2;
  sirens.forEach(([r,b]) => { r.visible = !ph; b.visible = !!ph; });
  sirenLight.color.setHex(ph ? 0x2a5bff : 0xff2030); sirenGlow1.visible = !ph; sirenGlow2.visible = !!ph;
  Snd.music(env.pa && env.power); Snd.tick(S.T, dt, S.ended);
  tickTimers(dt); simTick(dt, t);
  if (dogMesh.visible) dogMesh.position.y = 0.05 + Math.abs(Math.sin(t*12))*0.04;
  people.forEach(pp => { pp.g.visible = pp.show; if (pp.show) pp.update(dt, t); });
  if ((tickUI += dtR) > 0.15){ tickUI = 0; $('tval').textContent = Math.round(S.T); $('tbar').style.width = S.T + '%'; $('tbar').style.backgroundPosition = `-${S.T*2}px 0`; }
  composer.render();
});
window.__ready = true;
