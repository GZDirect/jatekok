<style>
/* Layout: full-bleed night diorama; status strip top, control sheet with two tabs bottom, view buttons on the right edge */
:root{
  --night:#07090f; --night-2:#121626;

}
[hidden]{display:none!important}
html,body{height:100%}
body{background:var(--night);color:var(--ink);font-family:var(--body);overflow:hidden}
#stage{position:fixed;inset:0;background:var(--night)}
canvas{display:block;touch-action:none}
.hud{position:fixed;inset:0;pointer-events:none;display:flex;flex-direction:column;justify-content:space-between;gap:8px;
  padding-top:calc(8px + env(safe-area-inset-top,0px));padding-bottom:calc(8px + env(safe-area-inset-bottom,0px));
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.hud>*{pointer-events:auto}
.top{display:flex;flex-direction:column;gap:6px;align-items:flex-start;max-width:min(460px,calc(100% - 52px))}
.status{display:flex;align-items:center;gap:8px;background:var(--panel);border:1px solid var(--line);border-radius:999px;padding:6px 12px;
  font-family:var(--display);font-size:14px;letter-spacing:.05em;text-transform:uppercase;color:var(--muted);cursor:pointer;
  backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);width:100%}
.status i{width:7px;height:7px;border-radius:50%;background:var(--bad);box-shadow:0 0 8px var(--bad);animation:bl 1s steps(2) infinite;flex:none}
@keyframes bl{50%{opacity:.2}}
.bar{flex:1;min-width:50px;height:6px;border-radius:3px;background:rgba(255,255,255,.08);overflow:hidden}
.bar b{display:block;height:100%;width:35%;background:linear-gradient(90deg,var(--good),var(--warm) 55%,var(--bad));background-size:300px 100%;transition:width .3s}
#tval{font-variant-numeric:tabular-nums;color:var(--ink);min-width:1.6em;text-align:right}
.status b{color:var(--ink);font-variant-numeric:tabular-nums}
.status .ok b{color:var(--good)}

.vchip{font-family:var(--display);font-size:13.5px;letter-spacing:.03em;background:var(--panel);border:1px solid rgba(255,74,74,.45);border-radius:999px;padding:3px 10px;color:var(--muted)}
.vchip.clock{border-color:rgba(255,183,100,.45)} .vchip.clock b{color:var(--warm)}
.vchip b{color:#ff8a8a;font-variant-numeric:tabular-nums}
.mood{font-family:var(--display);font-size:13.5px;letter-spacing:.03em;background:var(--panel);border:1px solid var(--line);border-radius:999px;padding:3px 10px;color:var(--muted);transition:color .2s,border-color .2s}
.mood.go{color:var(--good);border-color:rgba(95,224,142,.5)}
.mood.run{color:var(--warm);border-color:rgba(255,183,100,.6)}
.vsep{width:1px;align-self:stretch;margin:6px 2px;background:var(--line)}
.lines{display:flex;flex-direction:column;gap:3px;font-size:13px;line-height:1.35;max-width:100%}
.lines p{margin:0;background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:5px 10px;color:var(--muted);
  backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px)}
.lines p:first-child{color:var(--ink);transition:opacity .6s}
.lines p:nth-child(n+2){display:none}
.lines.open p{display:block}
.lines.fade p:first-child{opacity:0}
.side{position:fixed;right:max(10px,env(safe-area-inset-right,0px));top:calc(8px + env(safe-area-inset-top,0px));display:flex;flex-direction:column;gap:5px;pointer-events:auto}
.dock{align-self:center;display:flex;flex-direction:column;gap:4px;background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:5px;

.grid{display:grid;grid-template-columns:repeat(11,52px);gap:2px}

.ic{width:52px;height:50px;padding:4px 0 3px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;color:var(--muted)}
.ic svg{width:22px;height:22px;flex:none}
.ic span{font-family:var(--display);font-size:11.5px;letter-spacing:.03em;line-height:1;white-space:nowrap}

.ic.ev{color:#ffc0d6}

.ic.flash{animation:fl .5s}
@keyframes fl{0%{background:rgba(255,77,141,.45)}100%{background:transparent}}
.vb{width:38px;height:38px;display:grid;place-items:center;padding:0;background:var(--panel);border:1px solid var(--line);color:var(--ink)}
.vb svg{width:18px;height:18px}
.vb.txt{font-family:var(--display);font-size:12px;line-height:1}
.vb.muted{color:var(--muted)}
.vb.on{border-color:rgba(69,224,255,.6);color:var(--cyan);background:rgba(69,224,255,.12)}
#hint{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(160px + env(safe-area-inset-bottom,0px));background:var(--panel);border:1px solid var(--line);
  border-radius:8px;padding:6px 10px;font-size:13px;color:var(--ink);pointer-events:none;white-space:nowrap;transition:opacity .2s}
.status span{white-space:nowrap}

@media (max-width:600px){.grid{grid-template-columns:repeat(8,minmax(0,43px))}.status .vt>span{display:none}}
@media (max-width:480px){.status>span:nth-of-type(1){display:none}.status{gap:7px;padding:6px 10px}.ic{width:44px;height:48px}.ic span{font-size:10.5px}.ic svg{width:20px;height:20px}}
#loading{position:fixed;inset:0;display:grid;place-items:center;font-family:var(--display);font-size:22px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted)}
#endcard{position:fixed;left:50%;top:42%;transform:translate(-50%,-50%);width:min(340px,calc(100% - 32px));background:var(--panel);border:1px solid var(--line);
  border-radius:12px;padding:18px;display:flex;flex-direction:column;gap:10px;align-items:center;text-align:center}
#endcard h2{margin:0;font-family:var(--display);font-size:30px;letter-spacing:.06em;text-transform:uppercase}
#endcard.win h2{color:var(--good)} #endcard.lose h2{color:var(--bad)}
#endcard p{margin:0;color:var(--muted);font-size:14px;line-height:1.4}
#endcard button{justify-content:center;width:100%}
@media (prefers-reduced-motion:reduce){.status h1 i{animation:none}}
</style>

<script type="module">
import * as THREE from 'three';
import {EffectComposer} from 'three/addons/postprocessing/EffectComposer.js';
import {RenderPass} from 'three/addons/postprocessing/RenderPass.js';
import {UnrealBloomPass} from 'three/addons/postprocessing/UnrealBloomPass.js';
import {OutputPass} from 'three/addons/postprocessing/OutputPass.js';
import {GLTFLoader} from 'three/addons/loaders/GLTFLoader.js';
const $ = id => document.getElementById(id);
const rnd = (a,b) => a + Math.random()*(b-a);
// ================= renderer
const renderer = new THREE.WebGLRenderer({antialias:true});
renderer.setPixelRatio(Math.min(devicePixelRatio, 1.75));
renderer.shadowMap.enabled = true; renderer.shadowMap.type = THREE.PCFSoftShadowMap;
renderer.toneMapping = THREE.ACESFilmicToneMapping; renderer.toneMappingExposure = 1.1;
renderer.setClearColor(0x07090f, 1);
$('stage').appendChild(renderer.domElement);
const scene = new THREE.Scene();
scene.fog = new THREE.Fog(0x07090f, 70, 120);
const cam = new THREE.OrthographicCamera(-1,1,1,-1,0.1,220);
const target = new THREE.Vector3(0.5, 0.6, 3.6);
let theta = Math.PI/4, thetaGoal = theta; const PHI = THREE.MathUtils.degToRad(34);
const composer = new EffectComposer(renderer);
composer.addPass(new RenderPass(scene, cam));
const bloom = new UnrealBloomPass(new THREE.Vector2(256,256), 0.8, 0.55, 0.8);
composer.addPass(bloom); composer.addPass(new OutputPass());
function resize(){
  const w = innerWidth, h = innerHeight, a = w/h;
  const hh = a < 1 ? 12.6/a : 14.2;
  Object.assign(cam, {left:-hh*a, right:hh*a, top:hh, bottom:-hh}); cam.updateProjectionMatrix();
  renderer.setSize(w,h); composer.setSize(w,h); bloom.resolution.set(w/2, h/2);
  target.y = a < 1 ? -1.0 : 0.4;
}
addEventListener('resize', resize); resize();
const screens = [], ceilingPanels = [], streetLamps = [];
// ================= textures
function canvasTex(w, h, draw, rep=[1,1]){
  const c = document.createElement('canvas'); c.width = w; c.height = h; draw(c.getContext('2d'), w, h);
  const t = new THREE.CanvasTexture(c); t.colorSpace = THREE.SRGBColorSpace; t.wrapS = t.wrapT = THREE.RepeatWrapping; t.repeat.set(...rep);
  t.anisotropy = 4; return t;
}
const brickTex = canvasTex(256, 256, (x,w,h) => {
  x.fillStyle = '#3b2622'; x.fillRect(0,0,w,h);
  const bh = 16, bw = 48;
  for (let r=0; r<h/bh; r++) for (let c=-1; c<w/bw+1; c++){
    const off = r%2 ? bw/2 : 0, v = rnd(-14,14);
    x.fillStyle = `rgb(${118+v},${58+v*0.6},${46+v*0.4})`;
    x.fillRect(c*bw+off+2, r*bh+2, bw-4, bh-4);
  }
});
const brickDark = canvasTex(256, 256, (x,w,h) => {
  x.fillStyle = '#1d2230'; x.fillRect(0,0,w,h);
  for (let r=0; r<16; r++) for (let c=-1; c<7; c++){ const v = rnd(-8,8); x.fillStyle = `rgb(${54+v},${60+v},${78+v})`; x.fillRect(c*48+(r%2?24:0)+2, r*16+2, 44, 12); }
});
const woodTex = canvasTex(256, 256, (x,w,h) => {
  for (let r=0; r<8; r++){ const v = rnd(-12,12); x.fillStyle = `rgb(${120+v},${84+v},${56+v})`; x.fillRect(0, r*32, w, 31);
    x.fillStyle = 'rgba(0,0,0,.25)'; x.fillRect(rnd(0,w), r*32, 2, 32); }
}, [2,2]);
const tileTex = canvasTex(128, 128, (x,w,h) => { x.fillStyle = '#c9ccd0'; x.fillRect(0,0,w,h); x.fillStyle = '#9da2aa';
  for (let i=0;i<4;i++) for (let j=0;j<4;j++) if ((i+j)%2) x.fillRect(i*32, j*32, 32, 32); }, [3,3]);
const asphaltTex = canvasTex(256, 256, (x,w,h) => { x.fillStyle = '#16181d'; x.fillRect(0,0,w,h);
  for (let i=0;i<2500;i++){ const v = rnd(18,40); x.fillStyle = `rgb(${v},${v},${v+4})`; x.fillRect(rnd(0,w), rnd(0,h), 2, 2); } }, [6,2]);
const glowTex = canvasTex(128, 128, (x,w,h) => { const g = x.createRadialGradient(64,64,0,64,64,64);
  g.addColorStop(0,'rgba(255,255,255,1)'); g.addColorStop(.35,'rgba(255,255,255,.35)'); g.addColorStop(1,'rgba(255,255,255,0)'); x.fillStyle = g; x.fillRect(0,0,w,h); });

// box with UVs scaled to metres so textures tile evenly
function tbox(w, h, d, mats, tile=2){
  const g = new THREE.BoxGeometry(w, h, d), uv = g.attributes.uv;
  const dims = [[d,h],[d,h],[w,d],[w,d],[w,h],[w,h]];
  for (let f=0; f<6; f++) for (let i=0; i<4; i++){ const k = f*4+i; uv.setXY(k, uv.getX(k)*dims[f][0]/tile, uv.getY(k)*dims[f][1]/tile); }
  const m = new THREE.Mesh(g, mats); m.castShadow = true; m.receiveShadow = true; return m;
}
const std = (c, r=0.8, m=0, extra={}) => new THREE.MeshStandardMaterial({color:c, roughness:r, metalness:m, flatShading:true, ...extra});
const glowMat = (hex, k=3) => { const m = new THREE.MeshBasicMaterial({color:hex, toneMapped:false}); m.color.multiplyScalar(k); return m; };
function box(w,h,d,mat,x,y,z,parent){ const m = new THREE.Mesh(new THREE.BoxGeometry(w,h,d), mat); m.position.set(x,y,z); m.castShadow = m.receiveShadow = true; parent.add(m); return m; }

// ================= lights
const hemi = new THREE.HemisphereLight(0x4a5a90, 0x0a0b12, 0.75); scene.add(hemi);
const moon = new THREE.DirectionalLight(0x8ea4ff, 0.75);
moon.position.set(-8, 18, 10); moon.castShadow = true; moon.shadow.mapSize.set(1536,1536);
Object.assign(moon.shadow.camera, {left:-22,right:22,top:22,bottom:-22,near:1,far:80}); moon.shadow.mapSize.set(2048,2048); moon.shadow.bias = -0.0006; moon.shadow.normalBias = 0.03;
scene.add(moon);

// ================= ground, yard, outside road
const world = new THREE.Group(); scene.add(world);
const concrete = std(0x4b4f58, 0.9), iron = std(0x1c1f26, 0.5, 0.7), bars = std(0x3a3f47, 0.4, 0.8);
box(36, 0.6, 32, std(0x0f121a, 0.95), 0, -0.3, 4.0, world);                          // plinth
const asphalt = new THREE.MeshStandardMaterial({map:asphaltTex, roughness:0.22, metalness:0.35, color:0x9aa0b0});
box(22, 0.05, 10, std(0x34373e, 0.55, 0.2), 0, 0.0, 8.0, world);                      // yard
box(36, 0.05, 4.4, asphalt, 0, 0.0, 16.2, world);                                     // road outside the wall
box(36, 0.14, 1.2, concrete, 0, 0.07, 13.6, world);                                   // pavement
box(5, 0.05, 20, std(0x23262d, 0.5, 0.2), -14.5, 0.0, 2.0, world);                    // staff car park (left)
box(4.4, 0.05, 12, std(0x23262d, 0.5, 0.2), 13.6, 0.0, -1.0, world);                  // service yard (right)
for (let x=-16; x<=16; x+=2.6) box(1.3, 0.012, 0.12, glowMat(0xcfcfbf, 0.9), x, 0.03, 16.2, world);
// basketball court markings + hoop
box(0.08, 0.012, 6, glowMat(0xd8d2b0, 0.5), -2, 0.03, 8.5, world); box(6, 0.012, 0.08, glowMat(0xd8d2b0, 0.5), -2, 0.03, 5.5, world);
box(0.12, 3.0, 0.12, iron, -2, 1.5, 11.4, world); box(1.2, 0.8, 0.06, std(0xe8e8e8), -2, 3.0, 11.3, world);
for (const [x,z,s] of [[4,7,1.8],[-6,9.5,1.4],[1.5,15.8,2.2],[-9,16.6,1.6]]){
  const p = new THREE.Mesh(new THREE.CircleGeometry(s, 20), new THREE.MeshStandardMaterial({color:0x0b0d14, roughness:0.05, metalness:0.9}));
  p.rotation.x = -Math.PI/2; p.scale.set(1, 0.55, 1); p.position.set(x, 0.035, z); world.add(p);
}
function glow(hex, x, z, s, y=0.05){
  const m = new THREE.Mesh(new THREE.PlaneGeometry(s, s), new THREE.MeshBasicMaterial({map:glowTex, color:hex, transparent:true, blending:THREE.AdditiveBlending, depthWrite:false, toneMapped:false}));
  m.rotation.x = -Math.PI/2; m.position.set(x, y, z); world.add(m); return m;
}

// ================= cell block (22 × 10 m) and the yard wall
const block = new THREE.Group(); scene.add(block);
const WH = 4.6, PH = 2.9;
const walls = [];
const cinder = canvasTex(256, 256, (x,w,h) => { x.fillStyle = '#5d6168'; x.fillRect(0,0,w,h);
  for (let r=0;r<8;r++) for (let c=-1;c<5;c++){ const v = rnd(-10,10); x.fillStyle = `rgb(${120+v},${124+v},${130+v})`; x.fillRect(c*64+(r%2?32:0)+2, r*32+2, 60, 28); } });
const blockMat = std(0xffffff, 0.95, 0, {map:cinder, flatShading:false});
const paintHall = std(0xc9cfc4), paintWing = std(0x8fa0a8), paintKitchen = std(0xd8d8cf), paintCell = std(0xa7a99c);
const glassIn = std(0xd8ecff, 0.05, 0.2, {transparent:true, opacity:0.22});
const glassWin = std(0xffd9a0, 0.2, 0, {emissive:0xffb05a, emissiveIntensity:0.9, transparent:true, opacity:0.5});
function wall(len, h, openings, outer, inner, glass=glassWin, T=0.3){
  const g = new THREE.Group(), mats = [outer, outer, outer, outer, outer, inner];
  const piece = (x0, x1, y0, y1) => { if (x1-x0 < 0.01 || y1-y0 < 0.01) return; const m = tbox(x1-x0, y1-y0, T, mats); m.position.set((x0+x1)/2, (y0+y1)/2, 0); g.add(m); };
  let cur = -len/2;
  for (const o of [...openings].sort((a,b) => a.x-b.x)){
    const a = o.x - o.w/2, b = o.x + o.w/2;
    piece(cur, a, 0, h); piece(a, b, 0, o.y0); piece(a, b, o.y1, h); cur = b;
    if (o.glass){ const gl = new THREE.Mesh(new THREE.PlaneGeometry(o.w, o.y1-o.y0), glass); gl.position.set(o.x, (o.y0+o.y1)/2, 0); g.add(gl); const g2 = gl.clone(); g2.rotation.y = Math.PI; g.add(g2);

  loud:0, moodT:0, lastWarn:0, riotWait:0, breaching:false, busyEv:false, timerT:0});
Object.assign(S, S0());
const lines = []; let fadeT;
function log(t){ lines.unshift(t); lines.length = Math.min(lines.length, 5); const el = $('lines'); el.innerHTML = lines.map(l => `<p>${l}</p>`).join('');
  el.classList.remove('fade'); clearTimeout(fadeT); fadeT = setTimeout(() => el.classList.add('fade'), 7000); }
const timers = [];
const wait = ms => new Promise(r => timers.push({t:ms/1000, r}));
function tickTimers(dt){ for (let i = timers.length-1; i >= 0; i--){ if ((timers[i].t -= dt) <= 0){ const r = timers[i].r; timers.splice(i,1); r(); } } }
function bump(d){ S.T = THREE.MathUtils.clamp(S.T + d, 0, 100); }
const Art = r => r.a === 'az' ? 'Az' : 'A';

// ---- geography: hall in the middle, wing (control + staff room) left, kitchen + pantry right, yard in front
function region(x, z){ if (z > 3) return 'yard'; if (x < -3) return z < -1 ? 'ctrl' : 'staff'; if (x > 7) return z < -4 ? 'pantry' : 'kitchen'; return 'hall'; }
function zoneOf(p){ return region(p.g.position.x, p.g.position.z); }
const EXIT = {ctrl:[[-4,-4],[-2,-4]], staff:[[-4,1],[-2,1]], kitchen:[[8,1.5],[6,1.5]], pantry:[[10,-4.8],[10,-3.2],[8,1.5],[6,1.5]], yard:[[2,3.8],[2,2.2]]};
const reachable = (from, to) => !env.lockdown || region(...from) === region(...to);
function route(from, to){
  const a = region(...from), b = region(...to);
  if (a === b) return [to];
  return [...(a === 'hall' ? [] : EXIT[a]), ...(b === 'hall' ? [] : [...EXIT[b]].reverse()), to];
}
const pos2 = p => [p.g.position.x, p.g.position.z];

// ---- rioters: walk somewhere, look somewhere, come back
async function task(r, to, look, holdMs, pose='idle', faceTo=null){
  const gen = ++r.gen;
  if (!reachable(pos2(r.p), to)){ lockBlocked(r); return false; }
  r.look = 'walk'; r.p.set('idle');
  await r.p.go(route(pos2(r.p), to), 1.5); if (gen !== r.gen) return false;
  r.look = look; r.p.set(pose); if (faceTo) r.p.look(...faceTo);
  await wait(holdMs); if (gen !== r.gen) return false;
  r.look = 'walk'; r.p.set('idle');
  await r.p.go(route(pos2(r.p), r.home), 1.5); if (gen !== r.gen) return false;
  backToPost(r); return true;
}
function backToPost(r){
  r.look = r.baseLook;
  if (r === robbers.B){ r.p.set('point'); r.p.look(3.6, 0.3); }
  if (r === robbers.P){ r.p.set('sit'); r.p.look(-8.0, -7); }
  if (r === robbers.C){ r.p.set(S.ladderDone ? 'idle' : 'work'); r.p.look(-1.6, -3.4); }
  refresh();
}
function lockBlocked(r){ bLock.visible = true; bLock.position.set(r.p.g.position.x, 2.6, r.p.g.position.z); wait(1500).then(() => bLock.visible = false);
  Snd.play('clunk'); bump(3); log(`${Art(r)} ${r.name} az ajtót rángatja, de a folyosói zár nem engedi.`); }
const free = r => r.look === r.baseLook && !S.fleeing && !S.ended;

// ---- who sees what
const monitorsActive = () => env.power && !env.cctv && robbers.P.look === 'monitors' && zoneOf(robbers.P.p) === 'ctrl';
function covered(rt){
  if (monitorsActive()) return 'a Patkány a kamerákon mindent lát';
  for (const r of RB){
    const z = zoneOf(r.p), lk = r.look, watching = lk === 'room' || lk === 'walk';
    if (watching && z === 'hall') return `${r.a} ${r.name} figyeli a közös teret`;
    if (rt === 'yard' && (lk === 'out' || z === 'yard')) return `${r.a} ${r.name} az udvart figyeli`;
    if (rt === 'staff' && z === 'staff') return `${r.a} ${r.name} az öltözőben van`;
    if (rt === 'kitchen' && (z === 'kitchen' || lk === 'hatch')) return `${r.a} ${r.name} a konyhánál van`;
  }
  return null;
}
const dark = () => env.power ? 0 : 1;
function noise(rt){ return dark() + env.siren + env.cells + env.pa + (S.loud > 0 ? 2 : 0) + (rt === 'yard' ? (env.rain ? 1 : 0) + (env.fog ? 1 : 0) : 0); }
function yardGoal(){ return env.tower ? 'tower' : env.gate ? 'gate' : null; }
function routeFor(){
  let why = null;
  for (const rt of ['kitchen', 'staff', 'yard']){
    if (rt === 'kitchen' && !env.kitchen){ why = why || 'a konyha szervizajtaja zárva'; continue; }
    if (env.lockdown){ why = why || 'a folyosói zár minden ajtót lezár'; continue; }
    if (rt === 'yard' && !yardGoal()){ why = why || 'az udvarról nincs kiút: a kapu zárva, a torony üres'; continue; }
    if (rt === 'yard' && env.flood && !env.fog){ why = why || 'a reflektorok fényében az udvaron mindenki látszik'; continue; }
    const c = covered(rt); if (c){ why = why || c; continue; }
    if (noise(rt) < 1){ why = why || 'túl nagy a csend, félnek, hogy meghallják'; continue; }
    return {rt};
  }
  return {why: why || 'nincs szabad kijárat'};
}
function hostageThink(dt){
  if (S.ended || S.breaching) return;
  let best = null, why = 'figyelik őket';
  if (!S.esc && S.inside.length){ const o = routeFor(); if (o.rt) best = {h:S.inside.slice().sort((a,b) => b.c - a.c)[0], rt:o.rt}; else why = o.why; }
  S.inside.forEach(h => { if (!best || best.h !== h) h.ready = Math.max(0, h.ready - dt*0.6); });
  if (best){ best.h.ready += dt * best.h.c * (1 + 0.6*dark()); if (best.h.ready >= 1.4) escape(best.h, best.rt); }
  if ((S.moodT -= dt) <= 0){ S.moodT = 0.25; const m = $('mood');
    if (S.esc){ m.textContent = 'Túszok: valaki most szökik!'; m.className = 'mood run'; }
    else if (!S.inside.length){ m.textContent = 'Túszok: mindenki kint van'; m.className = 'mood go'; }
    else if (best){ m.textContent = 'Túszok: alkalmat látnak (' + {kitchen:'konyha', staff:'öltöző', yard:'udvar'}[best.rt] + ')'; m.className = 'mood go'; }
    else { m.textContent = 'Túszok: ' + why; m.className = 'mood'; } }
}
const SAFE = rt => rt === 'kitchen' ? [13.0 + (S.out%3)*0.6, 2.2] : rt === 'staff' ? [-13.2 + (S.out%3)*0.6, -1.2] : yardGoal() === 'tower' ? [8.6 + (S.out%3)*0.5, 10.0] : [-6 + (S.out%3)*0.7, 15.0];
async function escape(h, rt){
  h.ready = 0; const e = {h, rt, phase:'inside', caught:false, lucky:false}; S.esc = e;
  S.inside = S.inside.filter(x => x !== h); refresh();
  const sp = 1.4 + 0.5*dark(), P = h.p; P.set('idle');
  const inside = rt === 'kitchen' ? [[6,1.5],[8,1.5]] : rt === 'staff' ? [[-2,1],[-4,1]] : [[2,2.2],[2,3.8]];
  log({kitchen:'Egy túsz a konyhán át a szervizajtó felé oson!', staff:'Egy túsz az öltözőn át a személyzeti ajtó felé kúszik!', yard:'Egy túsz kiosont az udvarra!'}[rt]);
  await P.go(inside, sp); if (e.caught || S.ended) return;
  e.phase = 'out'; Snd.play('click');
  const out = rt === 'kitchen' ? [[10,-3],[11.6,-3],[12.6,-1]] : rt === 'staff' ? [[-10.6,1],[-11.6,1],[-12.6,0]] : (yardGoal() === 'tower' ? [[6,8],[8.6,10]] : [[-2,8],[-6,12.4],[-6,13.8]]);
  await P.go(out, 2.8); if (S.ended && !S.fleeing) return;
  await P.go([SAFE(rt)], 2.8);
  P.set('wave'); Snd.play('chime'); S.out++; S.esc = null; bump(-4); refresh();
  log(`Kijutott! (${S.out}/5 biztonságban)`);
  if (!S.inside.length) log(env.riot ? 'Bent már csak a lázadók vannak. A kommandó készül.' : 'Minden túsz kint van. Kommandó nélkül senki nem megy be a lázadókért.');
}
function checkCatch(){
  const e = S.esc; if (!e || e.phase !== 'inside' || e.caught) return;
  const c = covered(e.rt); if (!c) return;
  if (dark() && !e.lucky && Math.random() < 0.4){ e.lucky = true; log('A sötétben nem vették észre a mozgást.'); return; }
  e.caught = true; S.caughtN++; const P = e.h.p, d = P.done; P.path = []; P.done = null; d && d();
  bump(14); Snd.play('sting'); robbers.B.p.look(P.g.position.x, P.g.position.z);
  log('Rajtakapták a szökő túszt, vissza kellett ülnie. A lázadók idegesebbek lettek.');
  e.h.c *= 0.85;
  P.go(route(pos2(P), e.h.home), 1.4).then(() => { if (S.ended) return; P.set('crouch'); P.look(1.0, 0.2); S.inside.push(e.h); S.esc = null; refresh(); });
}

// ---- the ladder, the wall, the getaway
function drawLadder(){
  const s = Math.max(0, Math.ceil(S.ladder)); $('vt').textContent = S.ladderDone ? 'kész' : `${Math.floor(s/60)}:${String(s%60).padStart(2,'0')}`;
  const prog = 1 - S.ladder/150; rungs.forEach((r,i) => r.visible = i < Math.round(prog*12)); rails.forEach(r => { r.scale.y = Math.max(0.15, prog*4.2); r.position.y = r.scale.y/2; });
}
async function ladderReady(){
  S.ladderDone = true; Snd.play('clang'); log('Elkészült a létra a priccsek vázából! A lázadók a fal felé készülnek.'); bump(4);
  const C = robbers.C; ++C.gen; C.look = 'room'; C.p.set('idle');
  await wait(6000); tryFlee();
}
async function tryFlee(){
  if (S.ended || S.breaching) return;
  S.fleeing = true; S.fleeTries++; RB.forEach(r => { ++r.gen; r.look = 'walk'; r.p.set('idle'); });
  log('A lázadók a létrával az udvar felé indulnak!'); refresh();
  if (env.lockdown){ await wait(1500); RB.forEach(r => lockBlocked(r)); bump(12); log('A folyosói zár bent tartja őket. Nem jutnak ki az udvarra.'); return fleeFailed(); }
  ladderBuild.visible = false;
  await Promise.all(RB.map((r,i) => wait(i*300).then(() => r.p.go([...route(pos2(r.p), [2, 2.2]), [2, 3.8], [0, 6 + i*0.5]], 2.3))));
  if (S.ended || S.breaching) return;
  if (env.tower && env.flood && !env.fog){ bump(14); Snd.play('sting'); log('A toronyőr reflektora elkapta őket az udvaron! Visszamenekülnek a blokkba.'); return retreat(); }
  if (env.dogs){ bump(12); Snd.play('bark'); log('A kutyák rájuk rontanak az udvaron. A lázadók visszamenekülnek.'); return retreat(); }
  if (env.gate){ await Promise.all(RB.map((r,i) => r.p.go([[-6, 12.2], [-6, 15.5], [-6 + i*2, 17.5]], 2.8))); }
  else { await Promise.all(RB.map((r,i) => r.p.go([[-9.6 + i*0.4, 12.2]], 2.6))); Snd.play('clang'); await wait(1200); await Promise.all(RB.map((r,i) => r.p.go([[-9.6 + i*0.4, 12.6, 4.4], [-9.6 + i*0.4, 13.6, 0.14], [-12 + i, 17.6, 0.14]], 2.2))); }
  RB.forEach(r => r.p.show = false);
  end('flee');
}
async function retreat(){
  await Promise.all(RB.map((r,i) => r.p.go([[2, 3.8], [2, 2.2], [0 + i*1.2, -0.5]], 2.2)));
  RB.forEach(r => { r.look = 'room'; r.p.set('point'); r.p.look(3, 0.5); });
  ladderBuild.visible = true; return fleeFailed();
}
async function fleeFailed(){
  if (env.riot && S.fleeTries >= 2){ await wait(1500); return surrender(); }
  S.fleeing = false; S.fleeCool = 22; refresh();
  log(env.riot ? 'Csapdában vannak. Ha még egyszer nem jutnak ki, megadják magukat.' : 'Csapdában vannak, de kommandó nélkül nincs, aki elfogja őket.');
}
async function surrender(){
  S.breaching = true; log('A lázadók belátták, hogy nincs kiút. Megadják magukat a kommandónak.');
  await swatIn(); RB.forEach(r => { r.p.path = []; r.p.set('handsup'); });
  const saved = freeAll(); await wait(1500); end('win', {surrender:true, saved});
}
function freeAll(){ const n = S.inside.length; S.inside.forEach((h,i) => { h.p.set('idle'); wait(i*250).then(() => h.p.go([...route(pos2(h.p), [2, 2.2]), [2, 3.8], [-4 + i*0.6, 11.6]], 2.6).then(() => h.p.set('wave'))); S.out++; }); S.inside = []; return n; }
async function swatIn(){
  Snd.play('clang'); S.gateForce = true;
  swat.forEach(s => s.show = true);
  await Promise.all(swat.map((s,i) => wait(i*250).then(() => s.go([[-6, 14.2], [-6, 12.0], [2, 4.4], [2, 2.6], [1.5 + i*0.6, 1.6]], 2.8).then(() => { s.set('aim'); s.look(robbers.B.p.g.position.x, robbers.B.p.g.position.z); }))));
}
async function breach(forced){
  if (S.breaching || S.ended) return;
  S.breaching = true; RB.forEach(r => ++r.gen);
  const ok = !forced || !env.power || env.siren || S.loud > 0 || robbers.B.look !== 'room';
  log(forced ? 'A feszültség kritikus. A kommandó nem vár tovább, behatol!' : 'Minden túsz kint van. A kommandó behatol a blokkba!');
  await swatIn();
  if (ok){ Snd.play('clunk'); RB.forEach(r => { r.p.path = []; r.p.set('handsup'); }); const saved = freeAll(); await wait(1500); end('win', {forced, saved}); }
  else { RB.forEach(r => r.p.set('panic')); await wait(900); end('lose', {forced:true}); }
}

function simTick(dt, t){
  if (S.ended) return;
  let rate = -0.45;
  if (!env.power) rate += 1.0; if (env.cells) rate += 1.0; if (env.siren) rate += 1.2; if (env.flood) rate += 0.3; if (env.tower) rate += 0.3;
  if (env.dogs) rate += 0.4; if (env.gate) rate += 0.2; if (env.lockdown) rate += 0.6; if (env.fog) rate += 0.1;
  if (env.pa) rate -= 0.6; if (env.rain) rate -= 0.2;
  bump(rate*dt);
  S.loud = Math.max(0, S.loud - dt);
  if (!S.ladderDone){ const sp = (env.power ? 1 : 0.5) * (env.cells ? 1.5 : 1) * (robbers.C.look === 'work' ? 1 : 0); S.ladder -= dt*sp; if (S.ladder <= 0){ S.ladder = 0; ladderReady(); } }
  if ((S.timerT -= dt) <= 0){ S.timerT = 0.25; drawLadder(); }
  if (S.fleeCool > 0 && !S.fleeing){ S.fleeCool -= dt; if (S.fleeCool <= 0) tryFlee(); }
  hostageThink(dt); checkCatch();
  if (env.riot && !S.breaching && !S.fleeing){
    if (!S.inside.length && !S.esc){ S.riotWait += dt; if (S.riotWait > 3) breach(false); }
    else if (S.T >= 95) breach(true);
  }
  if (S.T >= 100 && !S.breaching){ RB.forEach(r => { ++r.gen; r.p.path = []; r.p.set('panic'); }); end('lose', {}); }
  else if (S.T > 82 && t - S.lastWarn > 12){ S.lastWarn = t; log(env.riot ? 'Figyelem: kritikus feszültség! 95-nél a kommandó magától behatol.' : 'Figyelem: a lázadók a végsőkig feszültek!'); }
}

function end(kind, o={}){
  if (S.ended) return;
  S.ended = true; refresh(); Snd.play(kind === 'lose' ? 'sting' : 'win');
  S.endKind = kind === 'win' ? (o.forced ? 'risky' : 'good') : kind;
  const c = $('endcard'); c.className = kind === 'lose' ? 'lose' : 'win'; c.hidden = false;

    win: o.surrender ? `Nem jutottak ki az udvarra, és feladták. ${S.out - o.saved} túsz maga jutott ki, ${o.saved} túszt a kommandó hozott ki.`

    D.turn = D.turn === 'angel' ? 'demon' : 'angel'; D.phase = 'plan'; D.left = PLAN;
    log(`${NAME[D.turn]} következik.`); ui();
  }
  function tick(dt){
    if (!D.on || D.phase === 'over' || D.phase === 'off') return;
    const out = S.out, caught = S.caughtN || 0;
    if (out > D.seenOut){ const n = out - D.seenOut; D.sc.angel += 10*n; D.br.angel.save += 10*n; D.seenOut = out; }
    if (caught > D.seenCaught){ const n = caught - D.seenCaught; D.sc.demon += 6*n; D.br.demon.caught += 6*n; D.seenCaught = caught; }
    if (D.phase === 'plan'){ D.left -= dt; if (D.left <= 0){ log(`${NAME[D.turn]}: lejárt az idő, a lépés elveszett.`); resolve(null); } }
    else if (D.phase === 'resolve'){ D.res -= dt; if (D.res <= 0) endTurn(); }
    if ((D.uiT = (D.uiT || 0) - dt) <= 0){ D.uiT = 0.2; ui(); }
  }
  // called by the level when the situation ends
  function over(kind){
    if (!D.on) return false;
    tick(0); finish(kind); return true;
  }
  function finish(kind){
    D.phase = 'over';
    const B = {good:['angel', 25], risky:null, flee:['demon', 20], lose:['demon', 30]};
    if (kind === 'good'){ D.sc.angel += 25; D.br.angel.end = 25; }
    if (kind === 'risky'){ D.sc.angel += 12; D.br.angel.end = 12; D.sc.demon += 6; D.br.demon.end = 6; }
    if (kind === 'flee'){ D.sc.demon += 20; D.br.demon.end = 20; }
    if (kind === 'lose'){ D.sc.demon += 30; D.br.demon.end = 30; }
    if (!kind){ const left = S.inside.length + (S.esc ? 1 : 0); D.sc.demon += 5*left; D.br.demon.left = 5*left; }
    const a = D.sc.angel, d = D.sc.demon, win = a > d ? 'angel' : d > a ? 'demon' : null;
    const endTxt = {good:'Jó befejezés', risky:'Kockázatos behatolás', flee:'A tettesek meglógtak', lose:'A helyzet elfajult'}[kind] || 'Letelt a 8 kör';
    $('endcard').hidden = true;
    modal.innerHTML = `<div class="box"><h2 style="color:${win === 'angel' ? '#ffd76a' : win === 'demon' ? '#ff6a6a' : 'var(--ink)'}">${win ? (win === 'angel' ? 'Az Angyal nyert' : 'A Démon nyert') : 'Döntetlen'}</h2>
      <p>${endTxt}. ${S.out} túsz jutott ki.</p>
      <table><tr><th>Pont</th><th class="a">Angyal</th><th class="d">Démon</th></tr>
      <tr><td>Kijutott túszok / lebukott szökések</td><td>${D.br.angel.save}</td><td>${D.br.demon.caught}</td></tr>
      <tr><td>Nyugalom / káosz a lépések után</td><td>${D.br.angel.calm}</td><td>${D.br.demon.chaos}</td></tr>
      <tr><td>Végkimenetel</td><td>${D.br.angel.end}</td><td>${D.br.demon.end}</td></tr>
      <tr><td>Bent maradt túszok</td><td>0</td><td>${D.br.demon.left}</td></tr>
      <tr class="tot"><td>Összesen</td><td>${a}</td><td>${d}</td></tr></table>
      <div class="choices"><button class="duo" id="mAgain">Visszavágó</button><button id="mMode">Mód választása</button></div></div>`;
    modal.hidden = false; ui();
    $d('mAgain').onclick = () => { modal.hidden = true; start(); };
    $d('mMode').onclick = () => { D.on = false; bar.hidden = true; showMode(); };
  }
  function ui(){
    if (!D.on){ document.querySelectorAll('.ic.blocked').forEach(b => b.classList.remove('blocked')); return; }
    bar.className = D.turn + (D.phase === 'resolve' ? ' resolve' : '');
    $d('dWho').textContent = D.phase === 'over' ? 'Vége' : D.phase === 'resolve' ? `${NAME[D.turn]} lépett` : `${NAME[D.turn]} köre`;
    $d('dClk').textContent = D.phase === 'plan' ? `0:${String(Math.max(0, Math.ceil(D.left))).padStart(2,'0')}` : D.phase === 'resolve' ? `${Math.max(0, Math.ceil(D.res))}s` : '';
    $d('dRnd').textContent = Math.min(D.round, ROUNDS); $d('dA').textContent = D.sc.angel; $d('dD').textContent = D.sc.demon;
    $d('dPass').disabled = D.phase !== 'plan';
    const blocked = D.phase === 'plan' ? D.block[D.turn] : null;
    document.querySelectorAll('.ic').forEach(b => { b.classList.toggle('blocked', !!blocked && (b.id === 'env-'+blocked || b.id === 'ev-'+blocked)); if (D.phase !== 'plan' && D.phase !== 'off') b.disabled = true; });
    if (D.phase === 'plan') refresh();
    const dock = document.querySelector('.dock'); if (dock) document.documentElement.style.setProperty('--dockH', dock.offsetHeight + 'px');
  }
  bar.querySelector('#dPass').onclick = () => { if (D.phase === 'plan'){ log(`${NAME[D.turn]} passzolt.`); resolve(null); } };
  return {showMode, take, tick, paused, over, get on(){ return D.on; }, get blockedKey(){ return D.on && D.phase === 'plan' ? D.block[D.turn] : null; }};
})();
// ================= view controls
$('vL').onclick = () => thetaGoal -= Math.PI/2;
$('vR').onclick = () => thetaGoal += Math.PI/2;
$('vLvl').hidden = true;
addEventListener('keydown', e => { if (e.key === 'q' || e.key === 'ArrowLeft') $('vL').click(); if (e.key === 'e' || e.key === 'ArrowRight') $('vR').click(); });
const cv = renderer.domElement, ptrs = new Map(); let dragX = null, pinch0 = 0, zoom0 = 1;
cv.addEventListener('pointerdown', e => { cv.setPointerCapture(e.pointerId); ptrs.set(e.pointerId, e); if (ptrs.size === 1) dragX = e.clientX;
  if (ptrs.size === 2){ const [a,b] = [...ptrs.values()]; pinch0 = Math.hypot(a.clientX-b.clientX, a.clientY-b.clientY); zoom0 = cam.zoom; dragX = null; } });
cv.addEventListener('pointermove', e => { if (!ptrs.has(e.pointerId)) return; ptrs.set(e.pointerId, e);
  if (ptrs.size === 2){ const [a,b] = [...ptrs.values()]; setZoom(zoom0 * Math.hypot(a.clientX-b.clientX, a.clientY-b.clientY) / pinch0); }
  else if (dragX !== null && Math.abs(e.clientX - dragX) > 60){ thetaGoal += (e.clientX > dragX ? -1 : 1)*Math.PI/2; dragX = e.clientX; } });
const up = e => { ptrs.delete(e.pointerId); if (!ptrs.size) dragX = null; };
cv.addEventListener('pointerup', up); cv.addEventListener('pointercancel', up);
cv.addEventListener('wheel', e => { e.preventDefault(); setZoom(cam.zoom*(e.deltaY < 0 ? 1.1 : 0.9)); }, {passive:false});
function setZoom(z){ cam.zoom = THREE.MathUtils.clamp(z, 0.75, 3.4); cam.updateProjectionMatrix(); }

let showOutside = false;
$('vOut').onclick = () => { showOutside = !showOutside; $('vOut').classList.toggle('on', showOutside); $('vOut').setAttribute('aria-pressed', showOutside);
  hint ? hint(showOutside ? 'Homlokzat: a falak állnak, kívülről látod az épületet' : 'Metszet: a kamera felőli falak lesüllyednek') : 0; };
// ================= main loop
await document.fonts.ready;
$('loading').hidden = true;
reset(); Duel.showMode();
const clock = new THREE.Clock();
let tickUI = 0, simT = 0;
renderer.setAnimationLoop(() => {
  const dtR = Math.min(clock.getDelta(), 0.05), dt = Duel.paused() ? 0 : dtR; simT += dt; const t = simT;
  Duel.tick(dtR);
  theta += (thetaGoal - theta)*Math.min(1, dtR*7);
  cam.position.set(target.x + 60*Math.sin(theta)*Math.cos(PHI), target.y + 60*Math.sin(PHI), target.z + 60*Math.cos(theta)*Math.cos(PHI));
  cam.lookAt(target);
  const sx = Math.sin(theta), cz = Math.cos(theta);
  walls.forEach(w => { const goal = !showOutside && (w.nx*sx + w.nz*cz) > 0.25 ? 0.06 : 1; w.s += (goal - w.s)*Math.min(1, dtR*8); w.g.scale.y = w.s; });
  // power
  const pw = env.power ? 1 : 0;
  roomLights.forEach(l => { l.intensity += (9*pw - l.intensity)*Math.min(1, dt*10 + (dt ? 0 : 0)); });
  monitors.forEach((m,i) => { m.visible = env.power; m.material.color.setHSL(env.cctv ? 0.33 : 0.42, 0.55, 0.35 + 0.05*Math.sin(t*3+i)); });
  panelLeds.forEach((l,i) => l.material.color.setHex(env.lockdown ? 0xff3030 : 0x5fe08e).multiplyScalar(pw ? 2 : 0.1));
  // cells
  cellDoors.forEach(c => { const goal = env.cells ? c.x - 0.95 : c.x; c.g.position.x += (goal - c.g.position.x)*Math.min(1, dt*3); });
  // yard lights, tower, gate
  floods.forEach(f => { f.l.intensity += ((env.flood && env.power ? 60 : 0) - f.l.intensity)*Math.min(1, dt*8); f.lens.material.color.setHex(0xffffff).multiplyScalar(env.flood && env.power ? 3 : 0.2); });
  const tOn = env.tower ? 1 : 0;
  tSpot.intensity += ((tOn ? 90 : 0) - tSpot.intensity)*Math.min(1, dt*6);
  { const sx2 = Math.sin(t*0.45)*6, tz = 8 + Math.cos(t*0.3)*2.5; tSpot.target.position.set(sx2 - 1, 0, tz); towerLamp.lookAt(sx2 - 1, 0, tz);
    const a = new THREE.Vector3(8.8, 7.5, 10.8), b = new THREE.Vector3(sx2 - 1, 0, tz); tBeam.scale.set(1, a.distanceTo(b), 1); tBeam.position.copy(a).add(b).multiplyScalar(0.5);
    tBeam.quaternion.setFromUnitVectors(new THREE.Vector3(0,-1,0), b.clone().sub(a).normalize()); tBeam.material.opacity = 0.07*(tSpot.intensity/90); tLens.material.color.setHex(0xffffff).multiplyScalar(0.3 + 3*tOn); }
  gate.position.x += (((env.gate || S.gateForce) ? -2.9 : 0) - gate.position.x)*Math.min(1, dt*2);
  // weather
  rain.visible = env.rain; if (env.rain) fall(rain, dt, 16);
  fogBank.children.forEach(m => { m.material.opacity += ((env.fog ? 0.32 : 0) - m.material.opacity)*Math.min(1, dt*1.5); m.position.x += m.userData.v*dt; if (m.position.x > 12) m.position.x = -12; m.lookAt(cam.position); });
  hemi.intensity = env.rain ? 0.6 : 0.8;
  smokeHaze.material.opacity += ((S.smoke ? 0.5 : 0) - smokeHaze.material.opacity)*Math.min(1, dt*2);
  // dogs
  dogs.forEach((d,i) => { d.visible = env.dogs; if (env.dogs){ const a = t*0.6 + i*Math.PI; d.position.set(Math.sin(a)*6 - 1, 0.05 + Math.abs(Math.sin(t*10+i))*0.04, 8 + Math.cos(a)*3); d.rotation.y = a + Math.PI; } });
  // helicopter fly-over
  if (S.heliT > 0){ S.heliT -= dt; heli.visible = true; const k = 1 - S.heliT/6; heli.position.set(-18 + k*36, 11, 4); rotor.rotation.y += dt*30; heliSpot.intensity = 60; } else { heli.visible = false; heliSpot.intensity = 0; }
  media.visible = false;
  const ph = Math.floor(t*3.2)%2;
  sirens.forEach(([r,b]) => { r.visible = !ph; b.visible = !!ph; });
  sirenLight.color.setHex(ph ? 0x2a5bff : 0xff2030); sirenGlow1.visible = !ph; sirenGlow2.visible = !!ph;
  if (env.siren){ roomLights.forEach(l => l.color.setHex(Math.floor(t*2.5)%2 ? 0xff3a2a : 0xfff2d8)); } else roomLights.forEach(l => l.color.setHex(0xfff2d8));
  Snd.music(false); Snd.tick(S.T, dt, S.ended);
  tickTimers(dt); simTick(dt, t);
  people.forEach(pp => { pp.g.visible = pp.show; if (pp.show) pp.update(dt, t); });
  if ((tickUI += dtR) > 0.15){ tickUI = 0; $('tval').textContent = Math.round(S.T); $('tbar').style.width = S.T + '%'; $('tbar').style.backgroundPosition = `-${S.T*2}px 0`; }
  composer.render();
});
window.__ready = true;
</script>
