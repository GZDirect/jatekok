<style>
/* Layout: full-bleed night diorama; status strip top, control sheet with two tabs bottom, view buttons on the right edge */
:root{
  --night:#07090f; --night-2:#121626;
  --panel:rgba(12,15,26,.84); --panel-2:rgba(24,30,50,.9); --line:rgba(150,170,230,.18);
  --ink:#eef0f8; --muted:#97a0bf;
  --neon:#ff4d8d; --cyan:#45e0ff; --warm:#ffb764; --good:#5fe08e; --bad:#ff4a4a;
  --display:"Barlow Condensed","Arial Narrow",system-ui,sans-serif;
  --body:"Atkinson Hyperlegible",system-ui,-apple-system,"Segoe UI",sans-serif;
  color-scheme:dark;
}
[hidden]{display:none!important}
html,body{height:100%}
body{background:var(--night);color:var(--ink);font-family:var(--body);overflow:hidden}
#stage{position:fixed;inset:0;background:radial-gradient(110% 80% at 50% 30%,var(--night-2),var(--night) 72%)}
canvas{display:block;touch-action:none}
.hud{position:fixed;inset:0;pointer-events:none;display:flex;flex-direction:column;justify-content:space-between;gap:8px;
  padding-top:calc(8px + env(safe-area-inset-top,0px));padding-bottom:calc(8px + env(safe-area-inset-bottom,0px));
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.hud>*{pointer-events:auto}
.top{display:flex;flex-direction:column;gap:6px;align-items:flex-start;max-width:min(460px,calc(100% - 52px))}
.status{display:flex;align-items:center;gap:8px;background:var(--panel);border:1px solid var(--line);border-radius:999px;padding:6px 12px;
  font-family:var(--display);font-size:14px;letter-spacing:.05em;text-transform:uppercase;color:var(--muted);cursor:pointer;
  backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);width:100%}
.status i{width:7px;height:7px;border-radius:50%;background:var(--bad);box-shadow:0 0 8px var(--bad);animation:bl 1s steps(2) infinite;flex:none}
@keyframes bl{50%{opacity:.2}}
.bar{flex:1;min-width:50px;height:6px;border-radius:3px;background:rgba(255,255,255,.08);overflow:hidden}
.bar b{display:block;height:100%;width:35%;background:linear-gradient(90deg,var(--good),var(--warm) 55%,var(--bad));background-size:300px 100%;transition:width .3s}
#tval{font-variant-numeric:tabular-nums;color:var(--ink);min-width:1.6em;text-align:right}
.status b{color:var(--ink);font-variant-numeric:tabular-nums}
.status .ok b{color:var(--good)}
.status .sep{width:1px;height:14px;background:var(--line)}
.mood{font-family:var(--display);font-size:13.5px;letter-spacing:.03em;background:var(--panel);border:1px solid var(--line);border-radius:999px;padding:3px 10px;color:var(--muted);transition:color .2s,border-color .2s}
.mood.go{color:var(--good);border-color:rgba(95,224,142,.5)}
.mood.run{color:var(--warm);border-color:rgba(255,183,100,.6)}
.vsep{width:1px;align-self:stretch;margin:6px 2px;background:var(--line)}
.lines{display:flex;flex-direction:column;gap:3px;font-size:13px;line-height:1.35;max-width:100%}
.lines p{margin:0;background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:5px 10px;color:var(--muted);
  backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px)}
.lines p:first-child{color:var(--ink);transition:opacity .6s}
.lines p:nth-child(n+2){display:none}
.lines.open p{display:block}
.lines.fade p:first-child{opacity:0}
.side{position:fixed;right:max(10px,env(safe-area-inset-right,0px));top:calc(8px + env(safe-area-inset-top,0px));display:flex;flex-direction:column;gap:5px;pointer-events:auto}
.dock{align-self:center;display:flex;flex-direction:column;gap:4px;background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:5px;
  backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);max-width:100%}
.row{display:flex;gap:3px;justify-content:center}
button{font:inherit;color:var(--ink);background:transparent;border:1px solid transparent;border-radius:10px;cursor:pointer;
  transition:border-color .15s,background .15s,transform .1s,color .15s}
button:active{transform:translateY(1px)}
button:focus-visible{outline:2px solid var(--cyan);outline-offset:1px}
button:disabled{opacity:.3;cursor:default}
.ic{width:52px;height:50px;padding:4px 0 3px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;color:var(--muted)}
.ic svg{width:22px;height:22px;flex:none}
.ic span{font-family:var(--display);font-size:11.5px;letter-spacing:.03em;line-height:1;white-space:nowrap}
.ic:hover:not(:disabled){background:rgba(255,255,255,.06);color:var(--ink)}
.ic.on{color:var(--cyan);background:rgba(69,224,255,.12);border-color:rgba(69,224,255,.4)}
.ic.ev{color:#ffc0d6}
.ic.ev:hover:not(:disabled){background:rgba(255,77,141,.12)}
.ic.flash{animation:fl .5s}
@keyframes fl{0%{background:rgba(255,77,141,.45)}100%{background:transparent}}
.vb{width:38px;height:38px;display:grid;place-items:center;padding:0;background:var(--panel);border:1px solid var(--line);color:var(--ink)}
.vb svg{width:18px;height:18px}
.vb.txt{font-family:var(--display);font-size:12px;line-height:1}
.vb.muted{color:var(--muted)}
#hint{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(130px + env(safe-area-inset-bottom,0px));background:var(--panel);border:1px solid var(--line);
  border-radius:8px;padding:6px 10px;font-size:13px;color:var(--ink);pointer-events:none;white-space:nowrap;transition:opacity .2s}
.status span{white-space:nowrap}
@media (min-width:860px){.dock{flex-direction:row}.dock .row+.row{border-left:1px solid var(--line);padding-left:4px}}
@media (max-width:480px){.status>span:nth-of-type(1){display:none}.status{gap:7px;padding:6px 10px}.ic{width:44px;height:48px}.ic span{font-size:10.5px}.ic svg{width:20px;height:20px}.row{gap:1px}}
#loading{position:fixed;inset:0;display:grid;place-items:center;font-family:var(--display);font-size:22px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted)}
#endcard{position:fixed;left:50%;top:42%;transform:translate(-50%,-50%);width:min(340px,calc(100% - 32px));background:var(--panel);border:1px solid var(--line);
  border-radius:12px;padding:18px;display:flex;flex-direction:column;gap:10px;align-items:center;text-align:center}
#endcard h2{margin:0;font-family:var(--display);font-size:30px;letter-spacing:.06em;text-transform:uppercase}
#endcard.win h2{color:var(--good)} #endcard.lose h2{color:var(--bad)}
#endcard p{margin:0;color:var(--muted);font-size:14px;line-height:1.4}
#endcard button{justify-content:center;width:100%}
@media (prefers-reduced-motion:reduce){.status h1 i{animation:none}}
</style>

<script type="importmap">

<script type="module">
import * as THREE from 'three';
import {EffectComposer} from 'three/addons/postprocessing/EffectComposer.js';
import {RenderPass} from 'three/addons/postprocessing/RenderPass.js';
import {UnrealBloomPass} from 'three/addons/postprocessing/UnrealBloomPass.js';
import {OutputPass} from 'three/addons/postprocessing/OutputPass.js';
import {GLTFLoader} from 'three/addons/loaders/GLTFLoader.js';

const $ = id => document.getElementById(id);
const FH = 3;                          // storey height
const fy = f => f*FH + 0.1;            // floor surface height
const rnd = (a,b) => a + Math.random()*(b-a);

// ================= renderer
const renderer = new THREE.WebGLRenderer({antialias:true});
renderer.setPixelRatio(Math.min(devicePixelRatio, 1.75));
renderer.shadowMap.enabled = true; renderer.shadowMap.type = THREE.PCFSoftShadowMap;
renderer.toneMapping = THREE.ACESFilmicToneMapping; renderer.toneMappingExposure = 1.1;
renderer.setClearColor(0x07090f, 1);
$('stage').appendChild(renderer.domElement);
const scene = new THREE.Scene();
scene.fog = new THREE.Fog(0x07090f, 40, 75);
const cam = new THREE.OrthographicCamera(-1,1,1,-1,0.1,200);
const target = new THREE.Vector3(0.3, 4.4, 1.6);
let theta = Math.PI/4, thetaGoal = theta; const PHI = THREE.MathUtils.degToRad(31);
const composer = new EffectComposer(renderer);
composer.addPass(new RenderPass(scene, cam));
const bloom = new UnrealBloomPass(new THREE.Vector2(256,256), 0.85, 0.55, 0.78);
composer.addPass(bloom); composer.addPass(new OutputPass());
function resize(){
  const w = innerWidth, h = innerHeight, a = w/h;
  const hh = a < 1 ? 7.4/a : 9.4;
  Object.assign(cam, {left:-hh*a, right:hh*a, top:hh, bottom:-hh}); cam.updateProjectionMatrix();
  renderer.setSize(w,h); composer.setSize(w,h); bloom.resolution.set(w/2, h/2);
  target.y = a < 1 ? 4.2 : 4.6; target.x = a < 1 ? 0.4 : 0.6;
}
addEventListener('resize', resize); resize();

// ================= textures
function canvasTex(w, h, draw, rep=[1,1]){
  const c = document.createElement('canvas'); c.width = w; c.height = h; draw(c.getContext('2d'), w, h);
  const t = new THREE.CanvasTexture(c); t.colorSpace = THREE.SRGBColorSpace; t.wrapS = t.wrapT = THREE.RepeatWrapping; t.repeat.set(...rep);
  t.anisotropy = 4; return t;
}
const brickTex = canvasTex(256, 256, (x,w,h) => {
  x.fillStyle = '#3b2622'; x.fillRect(0,0,w,h);
  const bh = 16, bw = 48;
  for (let r=0; r<h/bh; r++) for (let c=-1; c<w/bw+1; c++){
    const off = r%2 ? bw/2 : 0, v = rnd(-14,14);
    x.fillStyle = `rgb(${118+v},${58+v*0.6},${46+v*0.4})`;
    x.fillRect(c*bw+off+2, r*bh+2, bw-4, bh-4);
  }
});
const brickDark = canvasTex(256, 256, (x,w,h) => {
  x.fillStyle = '#1d2230'; x.fillRect(0,0,w,h);
  for (let r=0; r<16; r++) for (let c=-1; c<7; c++){ const v = rnd(-8,8); x.fillStyle = `rgb(${54+v},${60+v},${78+v})`; x.fillRect(c*48+(r%2?24:0)+2, r*16+2, 44, 12); }
});
const woodTex = canvasTex(256, 256, (x,w,h) => {
  for (let r=0; r<8; r++){ const v = rnd(-12,12); x.fillStyle = `rgb(${120+v},${84+v},${56+v})`; x.fillRect(0, r*32, w, 31);
    x.fillStyle = 'rgba(0,0,0,.25)'; x.fillRect(rnd(0,w), r*32, 2, 32); }
}, [2,2]);
const tileTex = canvasTex(128, 128, (x,w,h) => { x.fillStyle = '#c9ccd0'; x.fillRect(0,0,w,h); x.fillStyle = '#9da2aa';
  for (let i=0;i<4;i++) for (let j=0;j<4;j++) if ((i+j)%2) x.fillRect(i*32, j*32, 32, 32); }, [3,3]);
const asphaltTex = canvasTex(256, 256, (x,w,h) => { x.fillStyle = '#16181d'; x.fillRect(0,0,w,h);
  for (let i=0;i<2500;i++){ const v = rnd(18,40); x.fillStyle = `rgb(${v},${v},${v+4})`; x.fillRect(rnd(0,w), rnd(0,h), 2, 2); } }, [6,2]);
const glowTex = canvasTex(128, 128, (x,w,h) => { const g = x.createRadialGradient(64,64,0,64,64,64);
  g.addColorStop(0,'rgba(255,255,255,1)'); g.addColorStop(.35,'rgba(255,255,255,.35)'); g.addColorStop(1,'rgba(255,255,255,0)'); x.fillStyle = g; x.fillRect(0,0,w,h); });

// box with UVs scaled to metres so textures tile evenly
function tbox(w, h, d, mats, tile=2){
  const g = new THREE.BoxGeometry(w, h, d), uv = g.attributes.uv;
  const dims = [[d,h],[d,h],[w,d],[w,d],[w,h],[w,h]];
  for (let f=0; f<6; f++) for (let i=0; i<4; i++){ const k = f*4+i; uv.setXY(k, uv.getX(k)*dims[f][0]/tile, uv.getY(k)*dims[f][1]/tile); }
  const m = new THREE.Mesh(g, mats); m.castShadow = true; m.receiveShadow = true; return m;
}
const std = (c, r=0.8, m=0, extra={}) => new THREE.MeshStandardMaterial({color:c, roughness:r, metalness:m, flatShading:true, ...extra});
const glowMat = (hex, k=3) => { const m = new THREE.MeshBasicMaterial({color:hex, toneMapped:false}); m.color.multiplyScalar(k); return m; };
function box(w,h,d,mat,x,y,z,parent){ const m = new THREE.Mesh(new THREE.BoxGeometry(w,h,d), mat); m.position.set(x,y,z); m.castShadow = m.receiveShadow = true; parent.add(m); return m; }

// ================= lights
const hemi = new THREE.HemisphereLight(0x4a5a90, 0x0a0b12, 0.75); scene.add(hemi);
const moon = new THREE.DirectionalLight(0x8ea4ff, 0.75);
moon.position.set(-8, 18, 10); moon.castShadow = true; moon.shadow.mapSize.set(1536,1536);
Object.assign(moon.shadow.camera, {left:-14,right:14,top:14,bottom:-14,near:1,far:60}); moon.shadow.bias = -0.0006; moon.shadow.normalBias = 0.03;
scene.add(moon);

// ================= ground, street
const world = new THREE.Group(); scene.add(world);
const concrete = std(0x4b4f58, 0.9), curbMat = std(0x6b7078, 0.8);
box(22, 0.6, 19, std(0x0f121a, 0.95), 0, -0.3, 1.8, world);                               // plinth
const asphalt = new THREE.MeshStandardMaterial({map:asphaltTex, roughness:0.22, metalness:0.35, color:0x9aa0b0});
box(22, 0.05, 4.2, asphalt, 0, 0.0, 6.6, world);                                            // road
box(22, 0.05, 4.7, std(0x22252c, 0.95), 0, 0.0, -5.1, world);                               // back alley
box(22, 0.14, 1.6, concrete, 0, 0.07, 3.75, world);                                         // near sidewalk
box(22, 0.14, 1.4, concrete, 0, 0.07, 9.4, world);                                          // far sidewalk
box(22, 0.16, 0.12, curbMat, 0, 0.08, 4.55, world); box(22, 0.16, 0.12, curbMat, 0, 0.08, 8.7, world);
for (let x=-10; x<=10; x+=2.4) box(1.2, 0.012, 0.12, glowMat(0xcfcfbf, 0.9), x, 0.03, 6.6, world);
// puddles: glossy dark discs that catch the coloured glows
for (const [x,z,s] of [[1.5,5.7,1.6],[-2.5,7.4,2.2],[4.4,6.9,1.3],[-5.5,5.6,1.4],[0.2,3.8,0.9]]){
  const p = new THREE.Mesh(new THREE.CircleGeometry(s, 20), new THREE.MeshStandardMaterial({color:0x0b0d14, roughness:0.05, metalness:0.9}));
  p.rotation.x = -Math.PI/2; p.scale.set(1, 0.55, 1); p.position.set(x, 0.035+0.07*(z<4.6), z); world.add(p);
}
const glows = [];
function glow(hex, x, z, s, y=0.05){
  const m = new THREE.Mesh(new THREE.PlaneGeometry(s, s), new THREE.MeshBasicMaterial({map:glowTex, color:hex, transparent:true, blending:THREE.AdditiveBlending, depthWrite:false, toneMapped:false}));
  m.rotation.x = -Math.PI/2; m.position.set(x, y, z); world.add(m); glows.push(m); return m;
}

// ================= the building
const levels = [new THREE.Group(), new THREE.Group(), new THREE.Group()];
levels.forEach(l => scene.add(l));
const walls = [];                        // {g, nx, nz}
const glassByFloor = [[],[],[]], blinds = [];
const glassLit = [std(0xffd9a0, 0.2, 0, {emissive:0xffb05a, emissiveIntensity:1.3, transparent:true, opacity:0.55}),
                  std(0xffd9a0, 0.2, 0, {emissive:0xff9a4a, emissiveIntensity:1.3, transparent:true, opacity:0.55}),
                  std(0xffe0b0, 0.2, 0, {emissive:0xffc070, emissiveIntensity:1.4, transparent:true, opacity:0.55})];
const glassDark = std(0x1a2440, 0.1, 0.6, {transparent:true, opacity:0.6});
const paints = [std(0xc9cfd4), std(0xd8b48f), std(0x8ea7a2)];
const brick = std(0xffffff, 0.92, 0, {map:brickTex, flatShading:false});
const trim = std(0x9a9184, 0.8);
// wall: local x along the wall, +z faces outwards; openings {x,w,y0,y1,glass}
function wall(len, h, openings, f, paint){
  const g = new THREE.Group(), T = 0.22, mats = [brick, brick, brick, brick, brick, paint];
  const piece = (x0, x1, y0, y1) => { if (x1-x0 < 0.01 || y1-y0 < 0.01) return; const m = tbox(x1-x0, y1-y0, T, mats); m.position.set((x0+x1)/2, (y0+y1)/2, 0); g.add(m); };
  let cur = -len/2;
  for (const o of [...openings].sort((a,b) => a.x-b.x)){
    const a = o.x - o.w/2, b = o.x + o.w/2;
    piece(cur, a, 0, h); piece(a, b, 0, o.y0); piece(a, b, o.y1, h); cur = b;
    if (o.glass){ const gl = new THREE.Mesh(new THREE.PlaneGeometry(o.w, o.y1-o.y0), glassLit[f]); gl.position.set(o.x, (o.y0+o.y1)/2, 0); g.add(gl); glassByFloor[f].push(gl);
      const gl2 = gl.clone(); gl2.rotation.y = Math.PI; g.add(gl2); glassByFloor[f].push(gl2); }
    if (o.y0 > 0.2){ const s = box(o.w+0.2, 0.08, 0.3, trim, o.x, o.y0-0.04, 0.1, g); s.castShadow = false; }
    const lintel = box(o.w+0.16, 0.14, 0.26, trim, o.x, o.y1+0.07, 0.04, g); lintel.castShadow = false;
    if (f === 2 && o.glass){ const bl = new THREE.Mesh(new THREE.PlaneGeometry(o.w*0.98, o.y1-o.y0), std(0xd9cfb8, 0.9, 0, {side:THREE.DoubleSide, emissive:0x3a2a14, emissiveIntensity:0.4}));
      bl.position.set(o.x, o.y1, -0.13); bl.userData.h = o.y1-o.y0; bl.scale.y = 0.001; g.add(bl); blinds.push(bl); }
  }
  piece(cur, len/2, 0, h);
  if (h > FH){ const c = box(len+0.3, 0.18, 0.45, trim, 0, h-0.09, 0.08, g); c.castShadow = false; }

    get started(){ return !!ctx; }, get muted(){ return muted; }

async function takerTo(where, holdMs, gen){
  S.busy = true; S.focus = 'moving'; S.target = where; S.distracted = true; refresh();
  await taker.go([POS[where]], 1.35); if (gen !== S.gen) return false;
  S.focus = where;
  if (where === 'window' || where === 'window2') taker.look(taker.g.position.x, 6);
  if (where === 'door') taker.look(-3, -1.5);
  if (where === 'phone'){ taker.look(4, 0.9); taker.set('phone'); } else taker.set('idle');
  await wait(holdMs); if (gen !== S.gen) return false;
  return true;
}
async function takerHome(gen){
  S.focus = 'moving'; S.target = 'home'; S.distracted = false; taker.set('idle');
  checkCatch('turn');
  await taker.go([POS.home], 1.35); if (gen !== S.gen) return;
  taker.look(1.2, -2.3); taker.set('point'); S.focus = 'hostages'; S.target = null; S.busy = false; refresh();
}
async function distract(where, ms, after){
  if (S.ended) return;
  const gen = ++S.gen;
  const ok = await takerTo(where, ms, gen);
  if (!ok) return;
  if (after) after();
  takerHome(gen);
}
function windowCheck(){
  if (env.spot){ bump(4); log('A reflektor belevakít az ablakba. A túszejtő hátrahőköl.'); }
  if (env.roof && !env.blinds && !S.spotted){ S.spotted = true; bump(12); log('Kinézett, és meglátta a kommandósokat a tetőn! Idegesebb lett.'); }
}

// ---- hostages act on their own when they see a chance
function cover(route){ return (!env.power) + env.rain + (env.music && !S.partyGone) + env.blinds + (S.thunder > 0 ? 2 : 0) + (route === 'stairs' && env.lift ? 1 : 0); }
function opportunity(){
  if (!S.inside.length) return {ok:false, why:'mindenki kint van'};
  if (S.esc) return {ok:false, why:'egyikük épp szökik'};
  const route = env.ladder ? 'window' : 'stairs';
  if (!S.distracted) return {ok:false, why:'figyeli őket, nem mernek mozdulni'};
  if (route === 'window' && env.spot) return {ok:false, why:'a reflektor miatt nem mernek az ablakhoz'};
  if (route === 'stairs' && S.target === 'door') return {ok:false, why:'az ajtónál áll, a lépcső felé nincs út'};
  if (cover(route) === 0) return {ok:false, why:'túl nagy a csend, félnek, hogy meghallja'};
  return {ok:true, route, why: route === 'window' ? 'alkalmat látnak: az ablak felé' : 'alkalmat látnak: az ajtó felé'};
}
function hostageThink(dt){
  if (S.ended || S.breaching) return;
  const o = opportunity();
  const cand = [...S.inside].sort((a,b) => REC.get(b).courage - REC.get(a).courage)[0];
  S.inside.forEach(h => { const r = REC.get(h); if (!(o.ok && h === cand)) r.ready = Math.max(0, r.ready - dt*0.6); });
  if (o.ok && cand){ const r = REC.get(cand); r.ready += dt * r.courage * (env.power ? 1 : 1.6); if (r.ready >= 1.4) escape(cand, o.route); }
  if ((S.moodT -= dt) <= 0){ S.moodT = 0.25; const m = $('mood'); m.textContent = 'Túszok: ' + o.why; m.className = 'mood' + (o.ok ? ' go' : '') + (S.esc ? ' run' : ''); if (S.esc) m.textContent = 'Túszok: valaki most szökik!'; }
}
async function escape(h, route){
  const r = REC.get(h); r.ready = 0;
  const rec = {h, phase:'inside', caught:false, lucky:false}; S.esc = rec;
  S.inside = S.inside.filter(x => x !== h); refresh();
  const sp = env.power ? 1.35 : 1.85;
  h.set('idle'); log(route === 'window' ? 'Egy túsz magától nekiindul, az ablak felé kúszik!' : 'Egy túsz magától kiosont az ajtó felé!');
  await h.go(route === 'window' ? [[2.9, 2.3]] : [[-1.0,-1.5],[-2.6,-1.5]], sp);
  if (rec.caught || S.ended) return;
  rec.phase = 'out';
  if (route === 'window'){
    await h.go(FE_PATH, 1.4);
    Snd.play('clang'); await h.go([[2.15, 3.72, 0.14]], 1.6);
    await h.go([[2.3, 4.5, 0.14], [6.2, 5.3, 0.14]], 3.0);
  } else {
    await h.go([...stairsDown(2).slice(1)], 2.0);
    await h.go([[-3.2,3.7,0.14],[0.0,4.7,0.14],[6.2,5.3,0.14]], 3.0);
  }
  if (S.ended) return;
  h.look(7.4, 6.4); h.set('wave'); Snd.play('chime'); S.out++; S.esc = null; bump(-5);
  log(`Kijutott! A túsz biztonságban van a mentőnél. (${S.out}/3)`); refresh();
  if (!S.inside.length) log(env.roof ? 'Bent már csak a túszejtő van. A kommandó készül.' : 'Bent már csak a túszejtő van. Ha a kommandó a tetőn lenne, bemehetne.');
}
// called when he turns back, or a lightning flash lights the room
function checkCatch(why){
  const e = S.esc; if (!e || e.phase !== 'inside' || e.caught) return;
  if (why === 'flash' && Math.random() > 0.4) return;
  if (why === 'turn' && !env.power && !e.lucky && Math.random() < 0.4){ e.lucky = true; log('Visszafordult, de a sötétben nem vette észre a mozgást.'); return; }
  e.caught = true; S.caughtN++; const h = e.h, done = h.done; h.path = []; h.done = null; done && done();
  taker.look(h.g.position.x, h.g.position.z); bump(15); Snd.play('sting');
  log(why === 'flash' ? 'Egy villám kivilágította a szobát. Észrevette a szökő túszt!' : 'Visszafordult, és rajtakapta a szökő túszt. Vissza kellett ülnie.');
  const r = REC.get(h); r.courage *= 0.85;
  h.go([[r.home.x, r.home.z]], 1.3).then(() => { if (S.ended) return; h.look(taker.g.position.x, taker.g.position.z); h.set('crouch'); S.inside.push(h); S.esc = null; refresh(); });
}

// ---- the commando decides on its own
async function breach(forced){
  if (S.breaching || S.ended) return;
  S.breaching = true; S.gen++;
  const success = !forced || S.distracted || !env.power || S.thunder > 0;
  log(forced ? 'A feszültség kritikus. A kommandó nem vár tovább, behatol!' : 'Bent már nincs túsz. A kommandó behatol a tetőről!');
  Snd.play('clang');
  swat.forEach((s,i) => wait(i*350).then(() => s.go([[-3.5,-2.75,11.3],[-3.5,-2.75,Y2],[-2.75,-2.75,Y2],[-2.75,-1.5,Y2],[-1.4+i*0.5,-1.0+i*0.5,Y2]], 2.4).then(() => { s.look(taker.g.position.x, taker.g.position.z); s.set('aim'); })));
  await wait(3000); taker.path = []; taker.look(-1, -1);
  if (success){
    Snd.play('clunk'); taker.set('handsup');
    const saved = S.inside.length; S.out += saved; S.inside = []; hostages.forEach(h => { if (!h.path.length) h.set('idle'); });
    await wait(1200); end(true, forced, saved);
  } else { taker.set('panic'); await wait(800); end(false, true); }
}

function toggle(k){
  if (S.ended) return;
  env[k] = !env[k];
  const on = env[k];
  Snd.play({power:on ? 'click' : 'clunk', spot:'clunk', blinds:'whoosh', ladder:'clang', media:'shutter', roof:'click', rain:'click', music:'click', storm:'click', lift:'ding'}[k]);
  if (k === 'rain') Snd.loop('rain', on ? 0.2 : 0, 0.8);
  if (k === 'spot') Snd.loop('hum', on ? 0.035 : 0);
  if (k === 'lift') Snd.loop('lift', on ? 0.06 : 0, 0.5);
  if (k === 'power'){
    if (!on){ log('Lekapcsolták az áramot. A sötétben a túszok bátrabbak, a túszejtő viszont sokkal idegesebb.'); bump(10);
      if (!S.busy) distract('window', 7000, () => { windowCheck(); log('A túszejtő nem lát semmit odakint, visszamegy.'); }); }
    else log('Visszajött az áram.');
  }
  if (k === 'rain') log(on ? 'Eleredt az eső. A zápor zaja sok mindent elnyel.' : 'Elállt az eső.');
  if (k === 'storm'){ log(on ? 'Vihar jön. A mennydörgés elnyom minden zajt, de a villám kivilágítja a szobát.' : 'Elvonult a vihar.'); if (on) S.stormTimer = 3; }
  if (k === 'music') log(on ? 'Az 1. emeleten hangosan szól a zene. Elnyomja a neszeket, de idegesíti a túszejtőt.' : 'Elhallgatott a zene.');
  if (k === 'spot'){ log(on ? 'A reflektor a 2. emelet ablakaira világít. Ez nagyon zavarja a túszejtőt.' : 'Lekapcsolták a reflektort.'); if (on) bump(5); }
  if (k === 'blinds') log(on ? 'Leengedték a redőnyt. Kintről nem látni be, bentről nem látni ki.' : 'Felhúzták a redőnyt.');
  if (k === 'lift'){ log(on ? 'Elindították a liftet. A zúgása takarja a lépcsőházi neszeket, de a túszejtő gyanakszik.' : 'Leállt a lift.'); if (on) S.liftTimer = 8; }
  if (k === 'ladder') log(on ? 'A tűzoltók leengedték a tűzlétrát a járdáig. A túszok az ablakon át is menekülhetnek.' : 'Felhúzták a tűzlétrát. Csak a lépcsőház maradt.');
  if (k === 'media'){ log(on ? 'Megjelent a média. A túszejtő gyakrabban néz ki az ablakon.' : 'A tévések elmentek.'); if (on) bump(4); }
  if (k === 'roof'){ log(on ? 'A kommandó felállt a tetőn. Magától dönt, mikor megy be.' : 'A kommandó visszavonult.'); if (!on){ S.spotted = false; S.roofWait = 0; } }
  refresh();
}

// ---- per-frame simulation
function simTick(dt, t){
  if (S.ended) return;
  let rate = -0.4;
  if (!env.power) rate += 1.1; if (env.spot) rate += 1.8; if (env.music && !S.partyGone) rate += 0.5; if (env.media) rate += 0.7;
  if (env.storm) rate += 0.25; if (env.lift) rate += 0.15; if (env.rain) rate -= 0.3; if (env.blinds) rate -= 0.8; if (S.alarmOn) rate += 2;
  bump(rate*dt);
  if (env.media && !S.busy){ S.mediaTimer -= dt; if (S.mediaTimer <= 0){ S.mediaTimer = 14; log('A túszejtő kinéz az ablakon, a tévéseket figyeli.'); distract('window2', 5000, () => windowCheck()); } }
  if (env.lift && !S.busy){ S.liftTimer -= dt; if (S.liftTimer <= 0){ S.liftTimer = 18; Snd.play('ding'); log('A lift megáll az emeleten. A túszejtő gyanakodva az ajtóhoz megy.'); distract('door', 5000); } }
  // storm: flash, then thunder that masks every sound for a few seconds
  if (env.storm){ S.stormTimer -= dt; if (S.stormTimer <= 0){ S.stormTimer = rnd(7, 13); S.flash = 0.45; S.thunder = 3.2; Snd.play('thunder'); bump(2); checkCatch('flash'); } }
  S.thunder = Math.max(0, S.thunder - dt);
  if (S.flash > 0){ S.flash -= dt; const k = S.flash > 0.3 || (S.flash > 0.08 && S.flash < 0.18) ? 1 : 0; hemi.intensity += 5*k; moon.intensity = 0.75 + 6*k; }
  else moon.intensity = 0.75;
  hostageThink(dt);
  // commando on its own
  if (env.roof && !S.breaching){
    if (!S.inside.length && !S.esc){ S.roofWait += dt; if (S.roofWait > 2.5) breach(false); }
    else if (S.T >= 95) breach(true);
  }
  if (S.T >= 100 && !S.breaching){ S.gen++; taker.path = []; taker.set('panic'); end(false, false); }
  else if (S.T > 82 && t - S.lastWarn > 12){ S.lastWarn = t; log(env.roof ? 'Figyelem: a feszültség kritikus! 95-nél a kommandó magától behatol.' : 'Figyelem: a túszejtő a végsőkig feszült!'); }
}

function end(win, forced, saved=0){
  S.ended = true; refresh(); Snd.play(win ? 'win' : 'sting');
  const c = $('endcard'); c.className = win ? 'win' : 'lose'; c.hidden = false;
  $('endT').textContent = win ? (forced ? 'Kockázatos, de sikerült' : 'Mindenki kint van') : (forced ? 'A behatolás kudarcot vallott' : 'A tárgyalás megszakadt');
  $('endP').textContent = win
    ? (forced ? `A kommandó a kritikus pillanatban behatolt, és kihozta a bent maradt ${saved} túszt. Most próbáld meg úgy, hogy a túszok maguk jussanak ki.` : `A túszejtő megadta magát. Mindhárom túsz épségben kijutott. Végső feszültség: ${Math.round(S.T)}.`)
    : (forced ? `A kommandó akkor ment be, amikor a túszejtő éppen figyelt. A helyzet órákig elhúzódott. ${S.out} túsz jutott ki.` : `A túszejtő eltorlaszolta magát a lakásban. ${S.out} túsz jutott ki. A reflektor, a média és a sötétség gyorsan emeli a feszültséget.`);
  S.endKind = win ? (forced ? 'risky' : 'good') : 'lose'; Duel.over(S.endKind);
}
$('again').onclick = () => reset();
function reset(){
  S.gen++; const g = S.gen; Object.assign(S, S0()); S.gen = g + 1;
  Object.assign(env, ENV0); Snd.loop('rain', 0); Snd.loop('hum', 0); Snd.loop('lift', 0);

  if (rain.visible){ const a = rain.geometry.attributes.position.array; for (let i=0;i<RAIN;i++){ let y = a[i*6+1] - dt*16; if (y < 0) y += 18; a[i*6+1] = y; a[i*6+4] = y+0.45; a[i*6+3] = a[i*6]+0.04; } rain.geometry.attributes.position.needsUpdate = true; }
  hemi.intensity = env.rain ? 0.55 : 0.75;
  media.visible = env.media; crowd.forEach(c => c.show = env.media);
  if (env.media && Math.random() < 0.012){ flash.intensity = 30; Snd.play('shutter'); } else flash.intensity *= 0.8;
  swat.forEach(s => s.show = env.roof || S.breaching);
  // sirens
  const ph = Math.floor(t*3.2)%2;
  sirens.forEach(([r,b]) => { r.visible = !ph; b.visible = !!ph; });
  sirenLight.color.setHex(ph ? 0x2a5bff : 0xff2030); sirenGlow1.visible = !ph; sirenGlow2.visible = !!ph;
  if (bRing.visible) bRing.position.set(3.4, fy(2)+1.6+Math.abs(Math.sin(t*9))*0.12, 0.9);
  if (dog.visible){ dog.position.y = Y2 + Math.abs(Math.sin(t*12))*0.05; bDog.position.y = Y2+1.4+Math.abs(Math.sin(t*10))*0.1; }
  tickTimers(dt); simTick(dt, t);
  liftPanels.forEach((m,f) => m.material.color.setHex(env.lift && Math.floor(t*0.8) % 3 === f ? 0xffb764 : 0x332211).multiplyScalar(env.lift ? 2.2 : 1));
  people.forEach(pp => { if (pp.show) pp.update(dt, t);
    const lvl = Math.floor((pp.g.position.y + 0.5)/FH); pp.g.visible = pp.show && (pp.g.position.y < 0.5 || lvl <= maxLvl || (lvl >= 3 && maxLvl === 2)); });
  roof.visible = maxLvl === 2;
  if ((tickUI += dtR) > 0.15){ tickUI = 0; $('tval').textContent = Math.round(S.T); $('tbar').style.width = S.T + '%'; $('tbar').style.backgroundPosition = `-${S.T*2}px 0`; }
  composer.render();
});
window.__ready = true;
</script>
